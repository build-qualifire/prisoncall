<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopify Product ID Fetcher — Dev Tool</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 14px; background: #f5f5f5; color: #111; padding: 32px 24px;
    }
    h1 { font-size: 18px; font-weight: 700; margin-bottom: 4px; }
    .subtitle { color: #666; font-size: 13px; margin-bottom: 24px; }
    .token-row {
      display: flex; gap: 10px; align-items: center; margin-bottom: 20px;
    }
    .token-row input {
      flex: 1; padding: 9px 12px; border: 1.5px solid #ccc; border-radius: 8px;
      font-family: monospace; font-size: 13px; background: #fff;
    }
    .token-row input:focus { outline: none; border-color: #0070f3; }
    button#fetchBtn {
      padding: 9px 20px; background: #0070f3; color: #fff; border: none;
      border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer;
      white-space: nowrap;
    }
    button#fetchBtn:hover { background: #005ecc; }
    button#fetchBtn:disabled { background: #aaa; cursor: default; }
    #status { font-size: 13px; color: #555; margin-bottom: 16px; min-height: 20px; }
    #status.error { color: #d00; }
    #status.ok { color: #060; }
    .results-wrap { overflow-x: auto; }
    table {
      width: 100%; border-collapse: collapse; background: #fff;
      border-radius: 10px; overflow: hidden;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    }
    th {
      background: #111; color: #fff; text-align: left;
      padding: 10px 14px; font-size: 12px; font-weight: 700;
      letter-spacing: 0.06em; text-transform: uppercase; white-space: nowrap;
    }
    td {
      padding: 9px 14px; border-bottom: 1px solid #eee;
      vertical-align: top; word-break: break-all;
    }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #fafafa; }
    td.mono { font-family: monospace; font-size: 13px; }
    td.product { font-weight: 600; }
    .plan-pill {
      display: inline-block; background: #f0f0f0; border-radius: 5px;
      padding: 2px 7px; font-size: 12px; margin: 2px 0;
    }
    .none { color: #aaa; font-style: italic; }
    #copyBtn {
      margin-top: 16px; padding: 8px 16px; background: #333; color: #fff;
      border: none; border-radius: 8px; font-size: 13px; font-weight: 600;
      cursor: pointer; display: none;
    }
    #copyBtn:hover { background: #111; }
    pre#jsonOut {
      margin-top: 16px; background: #1e1e1e; color: #d4d4d4;
      padding: 16px; border-radius: 10px; font-size: 12px;
      overflow: auto; max-height: 400px; display: none;
      white-space: pre-wrap; word-break: break-all;
    }
  </style>
</head>
<body>

  <h1>Shopify Product ID Fetcher</h1>
  <p class="subtitle">Developer tool — delete after use &nbsp;|&nbsp; Store: nq5ig1-5w.myshopify.com &nbsp;|&nbsp; API: 2025-04</p>

  <div class="token-row">
    <input type="text" id="tokenInput" placeholder="Paste Storefront API public access token here…" autocomplete="off" spellcheck="false">
    <button id="fetchBtn" onclick="runFetch()">Fetch IDs</button>
  </div>

  <div id="status">Enter your Storefront API public access token and click Fetch IDs.</div>

  <div class="results-wrap">
    <table id="resultsTable" style="display:none">
      <thead>
        <tr>
          <th>#</th>
          <th>Product Title</th>
          <th>Variant ID</th>
          <th>Price</th>
          <th>Selling Plan ID</th>
          <th>Selling Plan Name</th>
        </tr>
      </thead>
      <tbody id="resultsBody"></tbody>
    </table>
  </div>

  <button id="copyBtn" onclick="copyJson()">Copy raw JSON</button>
  <pre id="jsonOut"></pre>

  <script>
    var STORE   = 'nq5ig1-5w.myshopify.com';
    var API_VER = '2025-04';
    var ENDPOINT = 'https://' + STORE + '/api/' + API_VER + '/graphql.json';

    var ALLOWED_TITLES = [
      'Fortnightly Plan',
      'Fortnightly Plan + Transfer Guarantee',
      'Fortnightly Plan + Renewal Guarantee',
      'Fortnightly Plan + Combo (Transfer & Renewal) Guarantee',
      'Monthly Plan',
      'Monthly Plan + Transfer Guarantee',
      'Monthly Plan + Renewal Guarantee',
      'Monthly Plan + Combo (Transfer & Renewal) Guarantee',
      'Half Yearly Plan',
      'Half Yearly Plan + Transfer Guarantee',
      'Half Yearly Plan + Renewal Guarantee',
      'Half Yearly Plan + Combo (Transfer & Renewal) Guarantee',
      '48 hrs Cancellation Guarantee (New Order)',
      'Lifetime Protection'
    ];

    var GQL = `{
  products(first: 50) {
    edges {
      node {
        id
        title
        variants(first: 5) {
          edges {
            node {
              id
              title
              price {
                amount
              }
              sellingPlanAllocations(first: 5) {
                edges {
                  node {
                    sellingPlan {
                      id
                      name
                    }
                  }
                }
              }
            }
          }
        }
      }
    }
  }
}`;

    function numericId(gid) {
      if (!gid) return '';
      var parts = gid.split('/');
      return parts[parts.length - 1];
    }

    function setStatus(msg, type) {
      var el = document.getElementById('status');
      el.textContent = msg;
      el.className = type || '';
    }

    async function runFetch() {
      var token = document.getElementById('tokenInput').value.trim();
      if (!token) {
        setStatus('Please paste your Storefront API access token first.', 'error');
        return;
      }

      var btn = document.getElementById('fetchBtn');
      btn.disabled = true;
      btn.textContent = 'Fetching…';
      setStatus('Fetching from Shopify Storefront API…');
      document.getElementById('resultsTable').style.display = 'none';
      document.getElementById('copyBtn').style.display = 'none';
      document.getElementById('jsonOut').style.display = 'none';
      document.getElementById('resultsBody').innerHTML = '';

      try {
        var res = await fetch(ENDPOINT, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-Shopify-Storefront-Access-Token': token
          },
          body: JSON.stringify({ query: GQL })
        });

        if (!res.ok) {
          throw new Error('HTTP ' + res.status + ' — ' + res.statusText);
        }

        var data = await res.json();

        if (data.errors) {
          throw new Error(data.errors.map(function(e){ return e.message; }).join('; '));
        }

        var allProducts = (data.data && data.data.products && data.data.products.edges) || [];
        var filtered = allProducts
          .map(function(e){ return e.node; })
          .filter(function(p){ return ALLOWED_TITLES.indexOf(p.title) !== -1; });

        // Sort to match ALLOWED_TITLES order
        filtered.sort(function(a, b){
          return ALLOWED_TITLES.indexOf(a.title) - ALLOWED_TITLES.indexOf(b.title);
        });

        if (filtered.length === 0) {
          setStatus('No matching products found. Check the access token and store.', 'error');
          btn.disabled = false; btn.textContent = 'Fetch IDs';
          return;
        }

        var tbody = document.getElementById('resultsBody');
        var rowNum = 0;

        filtered.forEach(function(product) {
          var variants = (product.variants && product.variants.edges) || [];
          variants.forEach(function(ve) {
            var v = ve.node;
            var plans = (v.sellingPlanAllocations && v.sellingPlanAllocations.edges) || [];

            if (plans.length === 0) {
              rowNum++;
              var tr = document.createElement('tr');
              tr.innerHTML =
                '<td>' + rowNum + '</td>' +
                '<td class="product">' + esc(product.title) + '</td>' +
                '<td class="mono">' + esc(numericId(v.id)) + '</td>' +
                '<td class="mono">$' + esc(parseFloat(v.price.amount).toFixed(2)) + '</td>' +
                '<td class="none" colspan="2">—</td>';
              tbody.appendChild(tr);
            } else {
              plans.forEach(function(pe, pi) {
                var sp = pe.node.sellingPlan;
                rowNum++;
                var tr = document.createElement('tr');
                tr.innerHTML =
                  '<td>' + rowNum + '</td>' +
                  '<td class="product">' + (pi === 0 ? esc(product.title) : '<span class="none">↳</span>') + '</td>' +
                  '<td class="mono">' + esc(numericId(v.id)) + '</td>' +
                  '<td class="mono">$' + esc(parseFloat(v.price.amount).toFixed(2)) + '</td>' +
                  '<td class="mono">' + esc(numericId(sp.id)) + '</td>' +
                  '<td><span class="plan-pill">' + esc(sp.name) + '</span></td>';
                tbody.appendChild(tr);
              });
            }
          });
        });

        document.getElementById('resultsTable').style.display = 'table';
        document.getElementById('copyBtn').style.display = 'inline-block';

        // Store raw JSON for copy
        document.getElementById('jsonOut')._raw = JSON.stringify(data, null, 2);

        setStatus('Done — ' + filtered.length + ' matching products found (' + rowNum + ' rows).', 'ok');

      } catch(err) {
        setStatus('Error: ' + err.message, 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Fetch IDs';
      }
    }

    function copyJson() {
      var raw = document.getElementById('jsonOut')._raw || '';
      var pre = document.getElementById('jsonOut');
      pre.textContent = raw;
      pre.style.display = 'block';
      if (navigator.clipboard) {
        navigator.clipboard.writeText(raw).then(function(){
          document.getElementById('copyBtn').textContent = 'Copied!';
          setTimeout(function(){ document.getElementById('copyBtn').textContent = 'Copy raw JSON'; }, 2000);
        });
      }
    }

    function esc(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    // Allow Enter key in token input
    document.getElementById('tokenInput').addEventListener('keydown', function(e){
      if (e.key === 'Enter') runFetch();
    });
  </script>

</body>
</html>
