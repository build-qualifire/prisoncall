<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Dashboard | Prisoncall Admin</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/svg+xml" href="../assets/brand_logos/Prisoncall_Icon_BLACK.svg">
  <link rel="manifest" href="/admin/manifest.json">
  <meta name="theme-color" content="#00D258">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/admin/admin.css">
</head>
<body>

<div class="admin-layout">

  <!-- Sidebar -->
  <aside class="admin-sidebar">
    <div class="sidebar-brand">
      <img src="/assets/brand_logos/Prisoncall_White.svg" alt="Prisoncall" class="sidebar-logo">
    </div>
    <nav class="sidebar-nav">
      <a href="/admin/dashboard.html" class="sidebar-nav-item active">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
        Dashboard
      </a>
      <a href="/admin/subscribers.html" class="sidebar-nav-item">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        Subscribers
      </a>
      <a href="/admin/transfers.html" class="sidebar-nav-item">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M8 7h12m0 0l-4-4m4 4l-4 4M16 17H4m0 0l4 4m-4-4l4-4"/></svg>
        Transfers
      </a>
      <a href="/admin/settings.html" class="sidebar-nav-item" data-role-min="super_admin">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
        Settings
      </a>
    </nav>
    <div class="sidebar-footer">
      <div class="sidebar-user-email" data-user-email></div>
      <button class="btn-logout" onclick="doLogout()">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/></svg>
        Sign out
      </button>
    </div>
  </aside>

  <!-- Main -->
  <main class="admin-main">
    <header class="admin-topbar">
      <div class="admin-topbar-title">Dashboard</div>
      <div class="admin-topbar-right" style="gap:8px">
        <div id="topbarDate" style="font-size:13px;color:var(--color-muted)"></div>
        <a href="/admin/settings.html" class="mobile-settings-btn" data-role-min="super_admin" aria-label="Settings">
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" width="20" height="20"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
        </a>
      </div>
    </header>

    <div class="admin-content">

      <!-- Metric cards 2x2 -->
      <div class="metric-grid">
        <div class="metric-card" id="cardActive">
          <div class="metric-label">Active Subscribers</div>
          <div class="metric-value green" id="mActive">-</div>
          <div class="metric-sub">Current active plans</div>
        </div>
        <div class="metric-card" id="cardMrr">
          <div class="metric-label">Avg MRR</div>
          <div class="metric-value green" id="mMrr">-</div>
          <div class="metric-sub">Normalised monthly revenue</div>
        </div>
        <div class="metric-card" id="cardTransfers">
          <div class="metric-label">Pending Transfers</div>
          <div class="metric-value" id="mTransfers">-</div>
          <div class="metric-sub">Awaiting DID entry</div>
        </div>
        <div class="metric-card" id="cardSuspended">
          <div class="metric-label">Suspended</div>
          <div class="metric-value" id="mSuspended">-</div>
          <div class="metric-sub" id="mSuspendedSub">Payment overdue</div>
        </div>
      </div>

      <!-- Recent activity -->
      <div class="card">
        <div class="card-header">
          <div class="card-title">Recent Activity</div>
          <a href="/admin/subscribers.html" class="btn btn--outline btn--sm">View subscribers</a>
        </div>
        <div id="activityContent">
          <div class="loading-state">
            <div class="spinner"></div>
            Loading activity...
          </div>
        </div>
      </div>

    </div>
  </main>

  <!-- Bottom tab bar -->
  <nav class="admin-bottom-bar">
    <div class="bottom-bar-inner">
      <a href="/admin/dashboard.html" class="bottom-bar-item active">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
        <span>Dashboard</span>
      </a>
      <a href="/admin/subscribers.html" class="bottom-bar-item">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <span>Subscribers</span>
      </a>
      <a href="/admin/transfers.html" class="bottom-bar-item">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M8 7h12m0 0l-4-4m4 4l-4 4M16 17H4m0 0l4 4m-4-4l4-4"/></svg>
        <span>Transfers</span>
      </a>
    </div>
  </nav>

</div>

<script type="module">
  import {
    initAdminPage, api, logout, fmtDate, fmtTimeAgo, fmtCurrency,
    formatMobile, statusBadge, orderTypeBadge
  } from '/admin/admin-auth.js';

  async function init() {
    const session = await initAdminPage();
    if (!session) return;

    document.getElementById('topbarDate').textContent =
      new Date().toLocaleDateString('en-AU', { weekday: 'short', day: '2-digit', month: 'short', year: 'numeric' });

    loadDashboard();
  }

  async function loadDashboard() {
    try {
      const data = await api('get_dashboard');

      document.getElementById('mActive').textContent = data.activeSubscribers ?? '-';
      document.getElementById('mMrr').textContent = fmtCurrency(data.avgMrr);

      const transfers = data.pendingTransfers ?? 0;
      document.getElementById('mTransfers').textContent = transfers;
      if (transfers > 0) {
        document.getElementById('cardTransfers').classList.add('warning');
        document.getElementById('mTransfers').classList.add('amber');
      }

      const suspended = data.suspendedCount ?? 0;
      document.getElementById('mSuspended').textContent = suspended;
      if (suspended > 0) {
        document.getElementById('cardSuspended').classList.add('danger');
        document.getElementById('mSuspendedSub').textContent = 'Needs action';
      }

      renderActivity(data.recentOrders || []);
    } catch (err) {
      document.getElementById('activityContent').innerHTML =
        `<div class="alert alert--error" style="margin:16px">
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" width="18" height="18"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
          ${err.message}
        </div>`;
    }
  }

  function renderActivity(orders) {
    const container = document.getElementById('activityContent');

    if (!orders || orders.length === 0) {
      container.innerHTML = `
        <div class="empty-state">
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2"/></svg>
          <h3>No orders yet</h3>
          <p>Activity will appear here when subscribers are created</p>
        </div>`;
      return;
    }

    const rows = orders.map(o => {
      const sub = o.subscriptions || {};
      const customerName = sub.customer_name || '-';
      const mobile = formatMobile(o.customer_mobile);
      return `
        <tr onclick="window.location='/admin/subscribers.html'" style="cursor:pointer">
          <td>
            <div style="margin-bottom:4px">${orderTypeBadge(o.order_type)}</div>
            <div class="col-name">${customerName}</div>
            <div class="col-sub">${mobile}</div>
          </td>
          <td>
            <div style="font-weight:600;font-size:14px">${o.prison_name || '-'}</div>
            <div class="col-sub">${o.prison_state || ''}</div>
          </td>
          <td>${statusBadge(o.status)}</td>
          <td style="white-space:nowrap;color:var(--color-muted);font-size:13px">${fmtTimeAgo(o.created_at)}</td>
        </tr>`;
    }).join('');

    container.innerHTML = `
      <div class="table-wrap">
        <table class="data-table">
          <thead>
            <tr>
              <th>Customer</th>
              <th>Prison</th>
              <th>Status</th>
              <th>When</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
      </div>`;
  }

  window.doLogout = function () {
    import('/admin/admin-auth.js').then(m => m.logout());
  };

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/admin/sw.js').catch(() => {});
  }

  init();
</script>

</body>
</html>
