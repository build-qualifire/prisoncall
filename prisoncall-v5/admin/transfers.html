<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transfers — Prisoncall Admin</title>
  <script>if('serviceWorker'in navigator)navigator.serviceWorker.getRegistrations().then(r=>r.forEach(sw=>sw.unregister()));</script>
  <meta name="robots" content="noindex,nofollow">
  <link rel="icon" href="/assets/brand_logos/Prisoncall_Favicon_Circle_Black.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/admin/admin.css">
  <style>
    .expand-row { display: none; }
    .expand-row.open { display: table-row; }
    .expand-content { padding: 20px 24px; background: #FAFBFF; border-bottom: 1px solid var(--color-border); }
    .expand-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    @media (max-width: 768px) { .expand-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body class="admin-body">

<div class="sidebar-overlay" id="sidebarOverlay"></div>

<aside class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <a href="/admin/subscribers.html" class="sidebar-logo">
      <img src="/assets/brand_logos/Prisoncall_White.svg" alt="Prisoncall" width="140" height="17" style="height:17px;width:auto;max-width:160px">
    </a>
    <button class="sidebar-close" id="sidebarClose" aria-label="Close menu">✕</button>
  </div>
  <nav class="sidebar-nav">
    <a href="/admin/subscribers.html" class="sidebar-link" data-page="subscribers">
      <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M17 20h5v-2a4 4 0 00-5.916-3.516M9 20H4v-2a4 4 0 015.916-3.516M15 7a4 4 0 11-8 0 4 4 0 018 0zm6 3a3 3 0 11-6 0 3 3 0 016 0zM3 10a3 3 0 116 0 3 3 0 01-6 0z"/></svg>
      Subscribers
    </a>
    <a href="/admin/transfers.html" class="sidebar-link" data-page="transfers">
      <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M8 7h12m0 0l-4-4m4 4l-4 4m-4 6H4m0 0l4 4m-4-4l4-4"/></svg>
      Transfers
    </a>
    <a href="/admin/settings.html" class="sidebar-link" data-page="settings" data-super-only>
      <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
      Settings
    </a>
  </nav>
  <div class="sidebar-footer">
    <span class="sidebar-user-email" id="userEmail"></span>
    <button class="sidebar-logout" id="btnLogout">Sign out</button>
  </div>
</aside>

<main class="admin-main">
  <header class="admin-header">
    <button class="hamburger" id="hamburger" aria-label="Open menu">
      <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <h1 class="admin-title">Transfers</h1>
    <div class="header-actions">
      <span id="countBadge" style="font-size:12px;color:#6B7280"></span>
    </div>
  </header>

  <div class="filter-bar">
    <div class="filter-tabs" id="filterTabs">
      <button class="filter-tab active" data-status="">All</button>
      <button class="filter-tab" data-status="PENDING">Pending</button>
      <button class="filter-tab" data-status="WINDOW_OPEN">Window Open</button>
      <button class="filter-tab" data-status="COMPLETED">Completed</button>
    </div>
    <div class="search-box" style="margin-left:auto">
      <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path stroke-linecap="round" d="M21 21l-4.35-4.35"/></svg>
      <input type="search" id="searchInput" placeholder="Name, prison…" autocomplete="off">
    </div>
  </div>

  <div style="padding:24px">
    <div class="table-wrap">
      <table class="admin-table" id="txTable">
        <thead>
          <tr>
            <th>Date Requested</th>
            <th>Customer</th>
            <th>From</th>
            <th>To</th>
            <th>Status</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="txBody">
          <tr class="loading-row"><td colspan="6"><span class="spinner"></span>Loading transfers…</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</main>

<script type="module">
import {
  initAdminPage, api, formatDID, formatMobile, fmtDate,
  statusPill, derivePBXName, copyText, validateDID, showToast, esc
} from '/admin/admin-supabase.js';

await initAdminPage();

let allTx    = [];
let filtered = [];
let activeStatus = '';
let searchTerm   = '';
let expandedId   = null;
let exchangeCache = {};

async function loadTx() {
  try {
    allTx = await api('get-transfers');
    applyFilters();
  } catch (err) {
    document.getElementById('txBody').innerHTML =
      `<tr class="empty-row"><td colspan="6">Failed to load: ${esc(err.message)}</td></tr>`;
  }
}

function applyFilters() {
  const q = searchTerm.toLowerCase().trim();
  filtered = allTx.filter(t => {
    const subName = t.subscriptions?.customer_name || '';
    if (activeStatus && t.status !== activeStatus) return false;
    if (q) {
      const hay = [subName, t.new_prison_name, t.old_prison_name].join(' ').toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
  document.getElementById('countBadge').textContent = `${filtered.length} transfer${filtered.length !== 1 ? 's' : ''}`;
  renderTable();
}

function renderTable() {
  const tbody = document.getElementById('txBody');
  if (!filtered.length) {
    tbody.innerHTML = `<tr class="empty-row"><td colspan="6">No transfers found</td></tr>`;
    return;
  }

  tbody.innerHTML = filtered.map(t => {
    const sub    = t.subscriptions || {};
    const name   = sub.customer_name || '—';
    const oldP   = t.old_prison_name ? `${t.old_prison_name}${t.old_prison_state ? ', '+t.old_prison_state.toUpperCase() : ''}` : '—';
    const newP   = t.new_prison_name ? `${t.new_prison_name}${t.new_prison_state ? ', '+t.new_prison_state.toUpperCase() : ''}` : '—';
    const isOpen = expandedId === t.id;

    return `<tr class="row-clickable${isOpen ? ' row-expanded' : ''}" data-txid="${esc(t.id)}">
        <td class="td-muted">${fmtDate(t.created_at)}</td>
        <td class="td-name">${esc(name)}</td>
        <td style="font-size:13px;color:#6B7280">${esc(oldP)}</td>
        <td style="font-size:13px;font-weight:600">${esc(newP)}</td>
        <td>${statusPill(t.status)}</td>
        <td style="text-align:right;padding-right:20px;font-size:18px;color:#6B7280;transition:transform .2s">
          <span style="display:inline-block;transform:rotate(${isOpen?'90':'0'}deg)">›</span>
        </td>
      </tr>
      <tr class="expand-row${isOpen ? ' open' : ''}" data-expand="${esc(t.id)}">
        <td colspan="6">
          <div class="expand-content" id="expand-${esc(t.id)}">
            ${isOpen ? renderExpandContent(t) : '<span class="spinner"></span>'}
          </div>
        </td>
      </tr>`;
  }).join('');

  // Row click = toggle expand
  tbody.querySelectorAll('tr.row-clickable[data-txid]').forEach(tr => {
    tr.addEventListener('click', () => toggleExpand(tr.dataset.txid));
  });

  // Re-bind action buttons in open expand
  if (expandedId) bindExpandActions(expandedId);
}

async function toggleExpand(txId) {
  if (expandedId === txId) {
    expandedId = null;
    renderTable();
    return;
  }
  expandedId = txId;
  renderTable();

  // Load exchange guidance for new prison if not yet cached
  const t = allTx.find(x => x.id === txId);
  if (t && t.new_prison_name && !exchangeCache[t.new_prison_name]) {
    try {
      const ex = await api('get-prison-lookup', { prison_name: t.new_prison_name });
      exchangeCache[t.new_prison_name] = ex || null;
      const el = document.getElementById(`expand-${txId}`);
      if (el) el.innerHTML = renderExpandContent(t);
      bindExpandActions(txId);
    } catch {}
  }
}

function renderExpandContent(t) {
  const sub      = t.subscriptions || {};
  const pbxName  = derivePBXName(sub);
  const assignedM = formatMobile(t.assigned_mobile);
  const oldDID   = t.old_did || '—';
  const exchange = exchangeCache[t.new_prison_name];

  const exchangeHtml = (() => {
    if (!exchange) return `<p style="font-size:13px;color:#6B7280">No exchange data for this prison yet.</p>`;
    const rows = [
      exchange.primary_exchange_code ? { code: exchange.primary_exchange_code, area: exchange.primary_area, label: 'Primary' } : null,
      exchange.fallback_1 ? { code: exchange.fallback_1, area: exchange.fallback_1_area, label: 'Fallback 1' } : null,
      exchange.fallback_2 ? { code: exchange.fallback_2, area: exchange.fallback_2_area, label: 'Fallback 2' } : null,
      exchange.fallback_3 ? { code: exchange.fallback_3, area: exchange.fallback_3_area, label: 'Fallback 3' } : null,
    ].filter(Boolean);
    return rows.map((r, i) => `
      <div class="exchange-item">
        <span class="exchange-code">${esc(r.code)}</span>
        <span class="exchange-area">${esc(r.area || '')}</span>
        <span class="exchange-badge ${i > 0 ? 'exchange-badge--fallback' : ''}">${esc(r.label)}</span>
      </div>`).join('');
  })();

  const isPending    = t.status === 'PENDING';
  const isWindowOpen = t.status === 'WINDOW_OPEN';

  return `
    <div class="expand-grid">
      <div style="display:flex;flex-direction:column;gap:14px">
        <div class="info-row">
          <span class="info-label">Old DID</span>
          <span class="info-value info-value--mono">${esc(oldDID)}</span>
        </div>
        <div class="info-row">
          <span class="info-label">VoipLine Name</span>
          <div style="display:flex;align-items:center;gap:8px;margin-top:3px">
            <span class="info-value info-value--mono">${esc(pbxName)}</span>
            <button class="copy-btn" data-copy-text="${esc(pbxName)}" data-copy-btn>Copy</button>
          </div>
        </div>
        <div class="info-row">
          <span class="info-label">Assigned Mobile</span>
          <div style="display:flex;align-items:center;gap:8px;margin-top:3px">
            <span class="info-value info-value--mono">${esc(assignedM)}</span>
            <button class="copy-btn" data-copy-text="${esc(assignedM)}" data-copy-btn>Copy</button>
          </div>
        </div>

        ${isPending ? `
        <div class="form-group" style="margin-top:4px">
          <label class="form-label" for="newDid-${esc(t.id)}">New Prisoncall Number (DID)</label>
          <input class="form-input" id="newDid-${esc(t.id)}" placeholder="61XXXXXXXXX" maxlength="11" inputmode="numeric" value="${esc(t.new_did || '')}" style="font-family:monospace">
          <p class="form-hint">11 digits, must start with 61</p>
          <p class="form-error" id="txErr-${esc(t.id)}">Must be 11 digits starting with 61</p>
        </div>
        <button class="btn btn--primary btn--sm" id="fulfilTxBtn-${esc(t.id)}">Fulfil Transfer</button>
        ` : ''}

        ${isWindowOpen ? `
        <div style="background:var(--color-amber-pale);border:1px solid #FDE68A;border-radius:8px;padding:14px">
          <p style="font-size:13px;font-weight:600;color:#92400E;margin-bottom:4px">7-day overlap window active</p>
          ${t.window_expires_at ? `<p style="font-size:12px;color:#92400E">Window closes: ${new Date(t.window_expires_at).toLocaleDateString('en-AU',{day:'numeric',month:'short',year:'numeric'})}</p>` : ''}
          <p style="font-size:13px;color:#92400E;margin-top:4px">Old DID stays active while the new number is registered. Click below once you have released it in VoipLine.</p>
        </div>
        <div class="info-row">
          <span class="info-label">New DID (active)</span>
          <span class="info-value info-value--mono">${esc(t.new_did || '—')}</span>
        </div>
        <div class="info-row">
          <span class="info-label">Old DID (still live)</span>
          <span class="info-value info-value--mono">${esc(t.old_did || '—')}</span>
        </div>
        <button class="btn btn--outline btn--sm" id="releaseDIDBtn-${esc(t.id)}">Old DID Released in VoipLine</button>
        ` : ''}

        <div class="form-group">
          <label class="form-label">Admin Notes</label>
          <textarea class="form-input" id="txNotes-${esc(t.id)}" placeholder="Notes about this transfer…">${esc(t.admin_notes || '')}</textarea>
          <span class="save-indicator" id="txNotesSaved-${esc(t.id)}">Saved</span>
        </div>
      </div>

      <div>
        <div class="exchange-box">
          <p class="exchange-title">Exchange Guidance for New Prison</p>
          ${exchangeHtml}
        </div>
      </div>
    </div>`;
}

function bindExpandActions(txId) {
  const el = document.getElementById(`expand-${txId}`);
  if (!el) return;

  // Copy buttons
  el.querySelectorAll('[data-copy-btn]').forEach(btn => {
    btn.addEventListener('click', () => copyText(btn.dataset.copyText, btn));
  });

  // Fulfil transfer
  const fulfilBtn = document.getElementById(`fulfilTxBtn-${txId}`);
  if (fulfilBtn) {
    fulfilBtn.addEventListener('click', () => handleFulfilTransfer(txId));
  }

  // Release DID
  const releaseBtn = document.getElementById(`releaseDIDBtn-${txId}`);
  if (releaseBtn) {
    releaseBtn.addEventListener('click', () => handleReleaseDID(txId));
  }

  // Notes auto-save
  const notesEl = document.getElementById(`txNotes-${txId}`);
  if (notesEl) {
    notesEl.addEventListener('blur', async () => {
      try {
        await api('update-transfer', { id: txId, admin_notes: notesEl.value });
        const ind = document.getElementById(`txNotesSaved-${txId}`);
        if (ind) { ind.classList.add('show'); setTimeout(() => ind.classList.remove('show'), 2000); }
      } catch { showToast('Failed to save notes', 'error'); }
    });
  }
}

async function handleFulfilTransfer(txId) {
  const input = document.getElementById(`newDid-${txId}`);
  const errEl = document.getElementById(`txErr-${txId}`);
  const val   = (input?.value || '').replace(/\D/g,'');

  errEl?.classList.remove('visible');
  if (!validateDID(val)) {
    errEl?.classList.add('visible');
    input?.focus();
    return;
  }

  const btn = document.getElementById(`fulfilTxBtn-${txId}`);
  btn.disabled = true; btn.textContent = 'Saving…';

  try {
    const now      = new Date();
    const expires  = new Date(now.getTime() + 7 * 24 * 60 * 60 * 1000);
    await api('update-transfer', {
      id: txId,
      new_did: val,
      status: 'WINDOW_OPEN',
      fulfilled_at: now.toISOString(),
      window_expires_at: expires.toISOString(),
    });
    const t = allTx.find(x => x.id === txId);
    if (t) { t.new_did = val; t.status = 'WINDOW_OPEN'; t.fulfilled_at = now.toISOString(); t.window_expires_at = expires.toISOString(); }
    showToast('Transfer fulfilled - 7-day window open', 'success');
    applyFilters();
  } catch (err) {
    showToast(err.message || 'Failed to fulfil transfer', 'error');
    btn.disabled = false; btn.textContent = 'Fulfil Transfer';
  }
}

async function handleReleaseDID(txId) {
  if (!confirm('Confirm: have you released the old DID in VoipLine?')) return;

  const btn = document.getElementById(`releaseDIDBtn-${txId}`);
  btn.disabled = true; btn.textContent = 'Saving…';

  try {
    const now = new Date().toISOString();
    await api('update-transfer', { id: txId, status: 'COMPLETED', old_did_released_at: now });
    const t = allTx.find(x => x.id === txId);
    if (t) { t.status = 'COMPLETED'; t.old_did_released_at = now; }
    showToast('Old DID released - transfer completed', 'success');
    expandedId = null;
    applyFilters();
  } catch (err) {
    showToast(err.message || 'Failed to update', 'error');
    btn.disabled = false; btn.textContent = 'Old DID Released';
  }
}

// Filter tabs
document.getElementById('filterTabs').addEventListener('click', e => {
  const tab = e.target.closest('.filter-tab');
  if (!tab) return;
  document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
  tab.classList.add('active');
  activeStatus = tab.dataset.status;
  applyFilters();
});

// Search
document.getElementById('searchInput').addEventListener('input', e => {
  searchTerm = e.target.value;
  applyFilters();
});

loadTx();
</script>
</body>
</html>
