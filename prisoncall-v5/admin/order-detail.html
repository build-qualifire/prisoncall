<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Order Detail | Prisoncall Admin</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/svg+xml" href="../assets/brand_logos/Prisoncall_Icon_BLACK.svg">
  <link rel="manifest" href="/admin/manifest.json">
  <meta name="theme-color" content="#00D258">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/admin/admin.css">
</head>
<body>

<div class="admin-layout">

  <!-- Sidebar -->
  <aside class="admin-sidebar">
    <div class="sidebar-brand">
      <img src="/assets/brand_logos/Prisoncall_White.svg" alt="Prisoncall" class="sidebar-logo">
    </div>
    <nav class="sidebar-nav">
      <a href="/admin/dashboard.html" class="sidebar-nav-item">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
        Dashboard
      </a>
      <a href="/admin/orders.html" class="sidebar-nav-item active">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
        Orders
      </a>
      <a href="/admin/customers.html" class="sidebar-nav-item">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/></svg>
        Customers
      </a>
      <a href="/admin/products.html" class="sidebar-nav-item" data-role-min="super_admin">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/></svg>
        Products
      </a>
      <a href="/admin/settings.html" class="sidebar-nav-item" data-role-min="super_admin">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
        Settings
      </a>
    </nav>
    <div class="sidebar-footer">
      <div class="sidebar-user-email" data-user-email></div>
      <button class="btn-logout" onclick="doLogout()">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/></svg>
        Sign out
      </button>
    </div>
  </aside>

  <!-- Main -->
  <main class="admin-main">
    <header class="admin-topbar">
      <div style="display:flex;align-items:center;gap:12px">
        <a href="/admin/orders.html" style="display:flex;align-items:center;color:var(--color-muted)" title="Back to orders">
          <svg width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
        </a>
        <div class="admin-topbar-title" id="pageTitle">Order Detail</div>
      </div>
      <div id="topbarBadge"></div>
    </header>

    <div class="admin-content" id="mainContent">
      <div class="loading-state">
        <div class="spinner"></div>
        Loading order...
      </div>
    </div>
  </main>

  <!-- Bottom tab bar -->
  <nav class="admin-bottom-bar">
    <div class="bottom-bar-inner">
      <a href="/admin/dashboard.html" class="bottom-bar-item">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
        <span>Dashboard</span>
      </a>
      <a href="/admin/orders.html" class="bottom-bar-item active">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
        <span>Orders</span>
      </a>
      <a href="/admin/customers.html" class="bottom-bar-item">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
        <span>Customers</span>
      </a>
    </div>
  </nav>

</div>

<script type="module">
  import {
    initAdminPage, api, logout, fmtDate, fmtDatetime, fmtCurrency,
    formatMobile, statusBadge, orderTypeBadge, addonBadges, addonsList,
    copyToClipboard, showToast, showSmsToast, isSmsUnlocked
  } from '/admin/admin-auth.js';

  let orderId = null;
  let order = null;
  let sub = null;
  let prisonLookup = null;

  async function init() {
    const session = await initAdminPage();
    if (!session) return;

    const params = new URLSearchParams(window.location.search);
    orderId = params.get('id');
    if (!orderId) {
      showError('No order ID provided.');
      return;
    }

    loadOrder();
  }

  async function loadOrder() {
    try {
      const data = await api('getOrder', { id: orderId });
      order = data.order;
      prisonLookup = data.prisonLookup;

      if (!order) {
        showError('Order not found.');
        return;
      }

      sub = order.subscriptions || null;

      document.getElementById('pageTitle').textContent = `Order #${orderId.slice(0, 8)}`;
      document.getElementById('topbarBadge').innerHTML = statusBadge(order.status);

      renderPage();
    } catch (err) {
      showError(err.message);
    }
  }

  function showError(msg) {
    document.getElementById('mainContent').innerHTML = `
      <div class="alert alert--error">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" width="18" height="18"><circle cx="12" cy="12" r="10"/></svg>
        ${msg}
      </div>`;
  }

  function renderPage() {
    const isTransfer = order.order_type === 'TRANSFER';
    const mobile = formatMobile(order.customer_mobile);
    const assignedMobile = formatMobile(order.assigned_mobile);
    const subName = sub?.customer_name || '-';
    const subEmail = sub?.customer_email || '-';
    const plan = sub?.plan_interval ? `${cap(sub.plan_interval)} / ${fmtCurrency(sub.plan_price)}` : '-';
    const addons = addonsList(sub);
    const shopifyOrderId = sub?.shopify_order_id || order.shopify_order_id || '-';
    const appstleId = sub?.appstle_subscription_id || '-';

    const transferBanner = isTransfer ? `
      <div class="transfer-banner">
        <div class="transfer-banner-label">Transfer Order</div>
        <div class="transfer-banner-info">
          Old Prison: ${order.old_prison_name || '-'} (${order.old_prison_state || '-'})
          ${order.old_did_number ? ` - Old DID: ${order.old_did_number}` : ''}
        </div>
      </div>` : '';

    const didSection = ['FULFILLED', 'ACTIVE'].includes(order.status) && order.did_number ? `
      <div class="detail-row">
        <span class="detail-key">DID</span>
        <span class="detail-val did">${order.did_number}</span>
      </div>
      <div class="detail-row">
        <span class="detail-key">3CX Extension</span>
        <span class="detail-val font-mono">${order.extension_numb || '-'}</span>
      </div>` : '';

    const exchangeHtml = buildExchangeHtml();

    document.getElementById('mainContent').innerHTML = `
      ${transferBanner}

      <div class="detail-grid">

        <!-- Left: Order info -->
        <div>
          <div class="card mb-16">
            <div class="card-header">
              <div class="card-title">${orderTypeBadge(order.order_type)} Order Info</div>
              ${sub?.id ? `<a href="/admin/customer-detail.html?id=${sub.id}" class="btn btn--outline btn--sm">View Subscriber</a>` : ''}
            </div>
            <div class="card-body">
              <div class="detail-row">
                <span class="detail-key">Customer</span>
                <span class="detail-val">${subName}</span>
              </div>
              <div class="detail-row">
                <span class="detail-key">Mobile</span>
                <span class="detail-val">${mobile}</span>
              </div>
              <div class="detail-row">
                <span class="detail-key">Email</span>
                <span class="detail-val">${subEmail}</span>
              </div>
              <div class="detail-row">
                <span class="detail-key">Prison</span>
                <span class="detail-val">${order.prison_name || '-'}, ${order.prison_state || '-'}</span>
              </div>
              <div class="detail-row">
                <span class="detail-key">Plan</span>
                <span class="detail-val">${plan}</span>
              </div>
              <div class="detail-row">
                <span class="detail-key">Add-ons</span>
                <span class="detail-val">${addons}</span>
              </div>
              <div class="detail-row">
                <span class="detail-key">Date</span>
                <span class="detail-val">${fmtDate(order.created_at)}</span>
              </div>
              <div class="detail-row">
                <span class="detail-key">Shopify Order</span>
                <span class="detail-val mono copyable" onclick="copyText('${shopifyOrderId}', this)" title="Click to copy">${shopifyOrderId}</span>
              </div>
              <div class="detail-row">
                <span class="detail-key">Appstle Sub</span>
                <span class="detail-val mono copyable" onclick="copyText('${appstleId}', this)" title="Click to copy">${appstleId}</span>
              </div>
              ${didSection}
            </div>
          </div>

          <!-- Timeline -->
          <div class="card">
            <div class="card-header"><div class="card-title">Order Timeline</div></div>
            <div class="card-body">
              <div class="timeline" id="timeline">
                ${buildTimeline()}
              </div>
            </div>
          </div>
        </div>

        <!-- Right: Exchange guidance + Actions -->
        <div>
          ${exchangeHtml}
          <div class="card" id="actionsCard">
            <div class="card-header"><div class="card-title">Actions</div></div>
            <div class="card-body" id="actionsBody">
              <!-- Rendered by renderActions() -->
            </div>
          </div>
        </div>

      </div>`;

    renderActions();
  }

  function buildExchangeHtml() {
    if (!prisonLookup) {
      return `<div class="card mb-16">
        <div class="card-header"><div class="card-title">Exchange Guidance</div></div>
        <div class="card-body"><p style="font-size:14px;color:var(--color-muted)">No lookup data for this prison.</p></div>
      </div>`;
    }

    const primary = prisonLookup.primary_exchange_code ? `
      <div class="exchange-card exchange-card--primary">
        <div class="exchange-label">Primary Exchange</div>
        <div class="exchange-name">${prisonLookup.primary_area || '-'}</div>
        <div class="exchange-code">${prisonLookup.primary_exchange_code}</div>
      </div>` : '';

    const fb1 = prisonLookup.fallback_1 ? `
      <div class="exchange-card exchange-card--fallback1">
        <div class="exchange-label">Fallback 1</div>
        <div class="exchange-name">${prisonLookup.fallback_1_area || '-'}</div>
        <div class="exchange-code">${prisonLookup.fallback_1}</div>
      </div>` : '';

    const fb2 = prisonLookup.fallback_2 ? `
      <div class="exchange-card exchange-card--fallback">
        <div class="exchange-label">Fallback 2</div>
        <div class="exchange-name">${prisonLookup.fallback_2_area || '-'}</div>
        <div class="exchange-code">${prisonLookup.fallback_2}</div>
      </div>` : '';

    const fb3 = prisonLookup.fallback_3 ? `
      <div class="exchange-card exchange-card--fallback">
        <div class="exchange-label">Fallback 3</div>
        <div class="exchange-name">${prisonLookup.fallback_3_area || '-'}</div>
        <div class="exchange-code">${prisonLookup.fallback_3}</div>
      </div>` : '';

    return `<div class="card mb-16">
      <div class="card-header">
        <div class="card-title">Exchange Guidance</div>
        <a href="https://portal.voipline.com.au" target="_blank" rel="noopener" class="btn btn--outline btn--sm">
          Open VoipLine
          <svg width="12" height="12" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
        </a>
      </div>
      <div class="card-body" style="padding-bottom:12px">
        ${primary}${fb1}${fb2}${fb3}
        ${prisonLookup.notes ? `<p style="font-size:12px;color:var(--color-muted);margin-top:8px">${prisonLookup.notes}</p>` : ''}
      </div>
    </div>`;
  }

  function buildTimeline() {
    const statusOrder = ['PENDING','DID_ORDERED','SOURCING','ACTIVATING','FULFILLED','OVERDUE','SUSPENDED','CANCELLED','ACTIVATION_FAILED'];
    const currentIdx = statusOrder.indexOf(order.status);

    // Build status labels
    const items = [];
    const statusLabels = {
      PENDING: 'Order created',
      DID_ORDERED: 'DID ordered from VoipLine',
      SOURCING: 'Sourcing DID',
      ACTIVATING: '3CX activation in progress',
      FULFILLED: 'Order fulfilled - DID active',
      OVERDUE: 'Payment overdue',
      SUSPENDED: 'Service suspended',
      CANCELLED: 'Subscription cancelled',
      ACTIVATION_FAILED: 'Activation failed',
    };

    items.push(`
      <div class="timeline-item">
        <div class="timeline-dot active"></div>
        <div class="timeline-title">${statusLabels[order.status] || order.status}</div>
        <div class="timeline-date">Current status - ${fmtDatetime(order.updated_at || order.created_at)}</div>
      </div>`);

    items.push(`
      <div class="timeline-item">
        <div class="timeline-dot"></div>
        <div class="timeline-title">Order created</div>
        <div class="timeline-date">${fmtDatetime(order.created_at)}</div>
      </div>`);

    if (order.sms_day_count > 0) {
      items.push(`
        <div class="timeline-item">
          <div class="timeline-dot error"></div>
          <div class="timeline-title">Day ${order.sms_day_count} payment SMS sent</div>
          <div class="timeline-date">${fmtDatetime(order.last_sms_sent_at)}</div>
        </div>`);
    }

    return items.join('');
  }

  function renderActions() {
    const body = document.getElementById('actionsBody');
    const status = order.status;

    if (status === 'PENDING') {
      body.innerHTML = `
        <div class="action-section">
          <div class="action-row">
            <button class="btn btn--outline" id="btnMarkOrdered" onclick="markDIDOrdered()">Mark DID Ordered</button>
            <button class="btn btn--green" id="btnShowFulfil" onclick="showFulfilForm()">Fulfil Order</button>
          </div>
          <div id="fulfilForm" style="display:none;margin-top:12px">
            <div class="form-group">
              <label class="form-label">Enter DID number</label>
              <input class="form-input form-input--mono" type="text" id="didInput" placeholder="61XXXXXXXXX" maxlength="11">
              <div class="form-error" id="didError" style="display:none"></div>
              <div class="form-hint">11 digits starting with 61, e.g. 61370489727</div>
            </div>
            <button class="btn btn--green btn--full" id="btnConfirmFulfil" onclick="confirmFulfil()">Confirm Fulfil</button>
          </div>
        </div>`;

    } else if (status === 'DID_ORDERED' || status === 'SOURCING') {
      body.innerHTML = `
        <div class="action-section">
          <button class="btn btn--green" onclick="showFulfilForm()">Fulfil Order</button>
          <div id="fulfilForm" style="display:none;margin-top:12px">
            <div class="form-group">
              <label class="form-label">Enter DID number</label>
              <input class="form-input form-input--mono" type="text" id="didInput" placeholder="61XXXXXXXXX" maxlength="11">
              <div class="form-error" id="didError" style="display:none"></div>
              <div class="form-hint">11 digits starting with 61, e.g. 61370489727</div>
            </div>
            <button class="btn btn--green btn--full" id="btnConfirmFulfil" onclick="confirmFulfil()">Confirm Fulfil</button>
          </div>
        </div>`;

    } else if (status === 'ACTIVATING') {
      body.innerHTML = `
        <div class="activating-state">
          <div class="spinner spinner--lg"></div>
          <div class="activating-text">3CX setup in progress...</div>
          <div class="activating-sub">n8n WF1 will be wired at B14. Waiting for activation confirmation.</div>
        </div>`;

    } else if (status === 'ACTIVATION_FAILED') {
      const did = order.did_number || '-';
      body.innerHTML = `
        <div class="alert alert--error mb-16">
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" width="18" height="18"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
          3CX activation failed for DID ${did}. Manual fix required.
        </div>
        <div class="action-section">
          <button class="btn btn--green" onclick="retryActivation()">Retry Activation</button>
          <p style="font-size:13px;color:var(--color-muted);margin-top:8px">Check 3CX and VoipLine manually, then click Retry.</p>
        </div>`;

    } else if (status === 'FULFILLED' || status === 'ACTIVE') {
      body.innerHTML = `
        <div class="alert alert--success">
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" width="18" height="18"><path d="M22 11.08V12a10 10 0 11-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
          Order fulfilled. DID is active.
        </div>
        <div class="detail-row" style="padding-top:0">
          <span class="detail-key">DID</span>
          <span class="detail-val did">${order.did_number || '-'}</span>
        </div>
        <div class="detail-row">
          <span class="detail-key">Extension</span>
          <span class="detail-val font-mono">${order.extension_numb || '-'}</span>
        </div>`;

    } else if (status === 'OVERDUE' || status === 'SUSPENDED') {
      renderSuspendedActions(body);

    } else if (status === 'CANCELLED') {
      body.innerHTML = `
        <div class="alert alert--error">
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" width="18" height="18"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
          This subscription has been cancelled.
        </div>`;

    } else {
      body.innerHTML = `<p style="font-size:14px;color:var(--color-muted)">No actions available for status: ${status}</p>`;
    }
  }

  function renderSuspendedActions(body) {
    const smsDayCount = parseInt(order.sms_day_count) || 0;
    const lastSent = order.last_sms_sent_at;
    const unlocked = smsDayCount > 0 && isSmsUnlocked(lastSent);
    const adminNotes = parseAdminNotes();
    const voiplDone = adminNotes.voipline_did_released || false;
    const appstleDone = adminNotes.appstle_cancelled || false;

    let html = '';

    // Always show Resume button
    html += `<div class="action-row mb-16">
      <button class="btn btn--orange" id="btnPause" onclick="pauseNumber()" ${smsDayCount > 0 ? 'style="display:none"' : ''}>
        I have removed DID from VoipLine - Pause Number
      </button>
      <button class="btn btn--green" id="btnResume" onclick="resumeNumber()">
        I have re-added DID to VoipLine - Resume Number
      </button>
    </div>`;

    // Progressive SMS
    if (smsDayCount === 0) {
      // No SMS sent yet - Pause button is visible
    } else if (smsDayCount >= 1 && smsDayCount < 4) {
      const nextDay = smsDayCount + 1;
      const btnLabel = unlocked ? `Send Day ${nextDay} SMS` : `Day ${nextDay} SMS - available at 7am tomorrow`;
      html += `
        <div style="margin-bottom:16px">
          <button class="btn ${unlocked ? 'btn--green' : 'btn--outline'}" id="btnProgressiveSms"
            ${unlocked ? '' : 'disabled'}
            onclick="sendProgressiveSms(${smsDayCount})">
            ${btnLabel}
          </button>
        </div>`;
    } else if (smsDayCount === 4) {
      html += `
        <div style="margin-bottom:16px">
          <button class="btn btn--outline" disabled>Day 4 SMS sent</button>
        </div>`;
    }

    // After Day 4: show cancellation buttons
    if (smsDayCount >= 4) {
      if (!voiplDone || !appstleDone) {
        html += `
          <div class="alert alert--warning mb-16">
            <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" width="18" height="18"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
            Action required: Cancel Appstle subscription and release VoipLine DID. Reminders at 2hr, 4hr, 12hr, 24hr intervals. (Wired at B14)
          </div>`;
      }

      html += `<div class="action-row">`;

      if (!voiplDone) {
        html += `<button class="btn btn--outline" onclick="markVoiplineDone()">VoipLine DID Released</button>`;
      } else {
        html += `<button class="btn btn--green" disabled>
          <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>
          VoipLine DID Released - Done
        </button>`;
      }

      if (!appstleDone) {
        html += `<button class="btn btn--outline" onclick="markAppstleDone()">Appstle Cancelled</button>`;
      } else {
        html += `<button class="btn btn--green" disabled>
          <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>
          Appstle Cancelled - Done
        </button>`;
      }

      html += `</div>`;
    }

    body.innerHTML = html;
  }

  // ---- Action handlers ----

  window.showFulfilForm = function () {
    const form = document.getElementById('fulfilForm');
    if (form) form.style.display = 'block';
  };

  window.markDIDOrdered = async function () {
    const btn = document.getElementById('btnMarkOrdered');
    btn.disabled = true;
    btn.textContent = 'Updating...';
    try {
      await api('updateOrder', { id: orderId, fields: { status: 'DID_ORDERED' } });
      order.status = 'DID_ORDERED';
      const subName = sub?.customer_name || 'Customer';
      const prison = order.prison_name || 'prison';
      showSmsToast('Admin team', `New order sourcing for ${subName} at ${prison}`);
      showToast('Status updated to DID Ordered');
      document.getElementById('topbarBadge').innerHTML = statusBadge('DID_ORDERED');
      renderActions();
    } catch (err) {
      showToast(err.message, 'error');
      btn.disabled = false;
      btn.textContent = 'Mark DID Ordered';
    }
  };

  window.confirmFulfil = async function () {
    const input = document.getElementById('didInput');
    const errorEl = document.getElementById('didError');
    const btn = document.getElementById('btnConfirmFulfil');
    const did = (input?.value || '').trim();

    // Validate DID
    errorEl.style.display = 'none';
    if (!/^\d{11}$/.test(did) || !did.startsWith('61')) {
      errorEl.textContent = 'DID must be 11 digits starting with 61 (e.g. 61370489727)';
      errorEl.style.display = 'flex';
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Setting up...';

    try {
      await api('updateOrder', {
        id: orderId,
        fields: { did_number: did, status: 'ACTIVATING' }
      });
      order.did_number = did;
      order.status = 'ACTIVATING';
      showToast('DID set. 3CX activation in progress...');
      document.getElementById('topbarBadge').innerHTML = statusBadge('ACTIVATING');
      renderActions();
    } catch (err) {
      showToast(err.message, 'error');
      btn.disabled = false;
      btn.textContent = 'Confirm Fulfil';
    }
  };

  window.retryActivation = async function () {
    try {
      await api('updateOrder', { id: orderId, fields: { status: 'PENDING' } });
      order.status = 'PENDING';
      showToast('Status reset to Pending');
      document.getElementById('topbarBadge').innerHTML = statusBadge('PENDING');
      renderActions();
    } catch (err) {
      showToast(err.message, 'error');
    }
  };

  window.pauseNumber = async function () {
    try {
      // Update subscription status to SUSPENDED
      if (sub?.id) {
        await api('updateSubscription', { id: sub.id, fields: { status: 'SUSPENDED' } });
      }
      await api('updateOrder', { id: orderId, fields: { status: 'SUSPENDED', sms_day_count: 1, last_sms_sent_at: new Date().toISOString() } });
      order.status = 'SUSPENDED';
      order.sms_day_count = 1;
      order.last_sms_sent_at = new Date().toISOString();

      const customerMobile = formatMobile(order.customer_mobile);
      const smsMsg = `Hi, Your Prisoncall plan payment failed. Your number has been paused.\nPlease update your payment account balance, and reply YES.\nThank you. Regards, Prisoncall.`;
      showSmsToast(customerMobile, smsMsg);
      showToast('Number paused. Day 1 SMS sent.');
      document.getElementById('topbarBadge').innerHTML = statusBadge('SUSPENDED');
      renderActions();
    } catch (err) {
      showToast(err.message, 'error');
    }
  };

  window.resumeNumber = async function () {
    try {
      if (sub?.id) {
        await api('updateSubscription', { id: sub.id, fields: { status: 'ACTIVE' } });
      }
      await api('updateOrder', { id: orderId, fields: { status: 'FULFILLED' } });
      order.status = 'FULFILLED';

      const customerMobile = formatMobile(order.customer_mobile);
      const smsMsg = `Hi, Your payment has cleared, and we have restored your Prisoncall number.\nTo avoid future disruptions, please ensure your payment method is updated before each renewal. Thank you for using Prisoncall.`;
      showSmsToast(customerMobile, smsMsg);
      showToast('Number resumed. Resume SMS sent.');
      document.getElementById('topbarBadge').innerHTML = statusBadge('FULFILLED');
      renderActions();
    } catch (err) {
      showToast(err.message, 'error');
    }
  };

  window.sendProgressiveSms = async function (currentDayCount) {
    const nextDay = currentDayCount + 1;
    const customerMobile = formatMobile(order.customer_mobile);

    const smsTemplates = {
      2: `Hi, Your Prisoncall number is still paused due to a failed payment.\nPlease update your payment account balance and reply YES to restore your service.\nRegards, Prisoncall.`,
      3: `Hi, Reminder: Your Prisoncall number remains paused. Please update your payment today to avoid cancellation. Reply YES once updated. Regards, Prisoncall.`,
      4: `Hi, Final notice: Your Prisoncall plan will be cancelled today due to unsuccessful payment. Please update your payment immediately and reply YES. Regards, Prisoncall.`,
    };

    const smsMsg = smsTemplates[nextDay];
    if (!smsMsg) return;

    try {
      const newCount = nextDay;
      await api('updateOrder', {
        id: orderId,
        fields: { sms_day_count: newCount, last_sms_sent_at: new Date().toISOString() }
      });
      order.sms_day_count = newCount;
      order.last_sms_sent_at = new Date().toISOString();

      showSmsToast(customerMobile, smsMsg);

      // After Day 4, also SMS admins
      if (newCount === 4) {
        const did = order.did_number || '-';
        const adminSms = `DAY 4 SMS SENT - ${sub?.customer_name || 'Customer'} DID ${did}.\nACTION REQUIRED: Cancel subscription in Appstle AND release DID in VoipLine.\nhttps://portal.voipline.com.au`;
        showSmsToast('Admin team', adminSms);
      }

      showToast(`Day ${nextDay} SMS sent`);
      renderActions();
    } catch (err) {
      showToast(err.message, 'error');
    }
  };

  window.markVoiplineDone = async function () {
    try {
      const notes = parseAdminNotes();
      notes.voipline_did_released = true;
      await api('updateOrder', { id: orderId, fields: { admin_notes: JSON.stringify(notes) } });
      order.admin_notes = JSON.stringify(notes);

      const customerMobile = formatMobile(order.customer_mobile);
      const smsMsg = `Hi, Your Prisoncall plan has been cancelled due to unsuccessful payments.\nYour number has been permanently deleted. To get a new Prisoncall number, please visit prisoncall.com.au. Regards, Prisoncall.`;
      showSmsToast(customerMobile, smsMsg);
      showToast('VoipLine DID released.');
      await checkBothCancelDone(notes);
      renderActions();
    } catch (err) {
      showToast(err.message, 'error');
    }
  };

  window.markAppstleDone = async function () {
    try {
      const notes = parseAdminNotes();
      notes.appstle_cancelled = true;
      await api('updateOrder', { id: orderId, fields: { admin_notes: JSON.stringify(notes) } });
      order.admin_notes = JSON.stringify(notes);
      showToast('Appstle cancellation marked.');
      await checkBothCancelDone(notes);
      renderActions();
    } catch (err) {
      showToast(err.message, 'error');
    }
  };

  async function checkBothCancelDone(notes) {
    if (notes.voipline_did_released && notes.appstle_cancelled) {
      if (sub?.id) {
        await api('updateSubscription', { id: sub.id, fields: { status: 'CANCELLED' } });
      }
      await api('updateOrder', { id: orderId, fields: { status: 'CANCELLED' } });
      order.status = 'CANCELLED';
      document.getElementById('topbarBadge').innerHTML = statusBadge('CANCELLED');
      showToast('Subscription cancelled.');
    }
  }

  function parseAdminNotes() {
    try {
      return JSON.parse(order.admin_notes || '{}');
    } catch {
      return {};
    }
  }

  window.copyText = function (text, el) {
    copyToClipboard(text, el);
  };

  function cap(s) {
    if (!s) return '';
    return s.charAt(0).toUpperCase() + s.slice(1).toLowerCase();
  }

  window.doLogout = function () {
    import('/admin/admin-auth.js').then(m => m.logout());
  };

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/admin/sw.js').catch(() => {});
  }

  init();
</script>

</body>
</html>
