  <!-- Main -->

        </button>
        <a href="/admin/settings.html" class="mobile-settings-btn" data-role-min="super_admin" aria-label="Settings">
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" width="18" height="18"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>

  <!-- Bottom tab bar -->

        <span>Jobs</span>

      <a href="/admin/subscribers.html" class="bottom-bar-item">

<script type="module">
import { initAdminPage, api, fmtDate, formatMobile, showToast, showSmsToast } from '/admin/admin-auth.js';

let allCancellations = [];

// ── Helpers ────────────────────────────────────────────────────────────────

function esc(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function formatDID(did) {
  if (!did) return '-';
  const d = String(did).replace(/\D/g, '');
  if (d.length === 11 && d.startsWith('61')) {
    const local = '0' + d.slice(2);
    return `${local.slice(0,4)} ${local.slice(4,7)} ${local.slice(7)}`;
  }
  return did;
}

function getOverdueBadge(updatedAt) {
  if (!updatedAt) return null;
  const hrs = (Date.now() - new Date(updatedAt).getTime()) / 3600000;
  if (hrs >= 24) return { text: 'URGENT - 24hr overdue', cls: 'overdue-badge--urgent' };
  if (hrs >= 12) return { text: '12hr overdue',          cls: 'overdue-badge--red'    };
  if (hrs >= 4)  return { text: '4hr overdue',           cls: 'overdue-badge--orange' };
  if (hrs >= 2)  return { text: '2hr overdue',           cls: 'overdue-badge--amber'  };
  return null;
}

function getAttrs(sub) {
  try {
    const raw = sub.subscription_attributes;
    return raw ? (typeof raw === 'string' ? JSON.parse(raw) : raw) : {};
  } catch { return {}; }
}

function setNavCount(id, n) {
  const el = document.getElementById(id);
  if (!el) return;
  if (n > 0) { el.textContent = n > 99 ? '99+' : n; el.style.display = ''; }
  else el.style.display = 'none';
}

// ── Nav counts ─────────────────────────────────────────────────────────────

async function refreshNavCounts() {
  try {
    const c = await api('get_nav_counts');
    setNavCount('nav-jobs-count',          c.pending_jobs);
    setNavCount('nav-transfers-count',     c.pending_transfers);
    setNavCount('nav-suspended-count',     c.suspended_count);
    setNavCount('nav-cancellations-count', c.pending_cancellations);
    setNavCount('bar-jobs-count',          c.pending_jobs);
    setNavCount('bar-transfers-count',     c.pending_transfers);
    setNavCount('bar-suspended-count',     c.suspended_count);
    setNavCount('bar-cancellations-count', c.pending_cancellations);
  } catch {}
}

// ── Load ───────────────────────────────────────────────────────────────────

async function loadCancellations() {
  const container = document.getElementById('mainContent');
  container.innerHTML = '<div class="loading-state"><div class="spinner"></div>Loading cancellations...</div>';
  try {
    allCancellations = await api('get_cancellations');
    renderCancellations();
  } catch (err) {
    container.innerHTML = `<div class="alert alert--error">${esc(err.message)}</div>`;
  }
}

function renderCancellations() {
  const container = document.getElementById('mainContent');

  const pending   = allCancellations.filter(s => !getAttrs(s).voipline_cancelled);
  const confirmed = allCancellations.filter(s =>  getAttrs(s).voipline_cancelled);

  let html = '';

  html += `<div class="section-label"><span class="section-dot section-dot--amber"></span>Needs action (${pending.length})</div>`;
  if (pending.length === 0) {
    html += `<div class="empty-state">
      <svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
      <h3>All done</h3>
      <p>No cancellations pending VoipLine cleanup</p>
    </div>`;
  } else {
    pending.forEach(sub => { html += renderPendingCard(sub); });
  }

  html += `<div class="section-label"><span class="section-dot section-dot--grey"></span>Confirmed (${confirmed.length})</div>`;
  if (confirmed.length === 0) {
    html += `<p class="text-sm text-muted" style="padding:8px 0">No confirmed cancellations yet</p>`;
  } else {
    confirmed.forEach(sub => { html += renderConfirmedCard(sub); });
  }

  container.innerHTML = html;
}

function renderPendingCard(sub) {
  const id      = sub.id;
  const prison  = [esc(sub.prison_name), esc(sub.prison_state)].filter(Boolean).join(', ');
  const overdue = getOverdueBadge(sub.updated_at);

  return `
    <div class="job-card job-card--cancelled" id="cancel-${id}">
      <div class="card-top">
        <div class="card-header-row">
          <div class="card-name">${esc(sub.customer_name || '-')}</div>
          <div class="card-badges">
            <span class="badge badge--cancelled">Cancelled</span>
            ${overdue ? `<span class="overdue-badge ${overdue.cls}">${overdue.text}</span>` : ''}
          </div>
        </div>
        <div class="card-fields">
          <div class="card-field">
            <span class="field-label">Mobile:</span>
            <span class="field-value">${formatMobile(sub.customer_mobile)}</span>
          </div>
          <div class="card-field">
            <span class="field-label">Prison:</span>
            <span class="field-value">${prison || '-'}</span>
          </div>
          <div class="card-field">
            <span class="field-label">DID to release in VoipLine:</span>
            <span class="field-value field-value--mono" style="color:#9A3412">${formatDID(sub.current_did)}</span>
          </div>
          ${sub.seal_subscription_id ? `<div class="card-field">
            <span class="field-label">Seal ID:</span>
            <span class="field-value field-value--muted">${esc(sub.seal_subscription_id)}</span>
          </div>` : ''}
        </div>
      </div>
      <div class="card-instruction">
        Go to VoipLine. Delete the user licence and release this DID. Then confirm below.
      </div>
      <div class="card-action">
        <button class="btn btn--green btn--full" onclick="confirmVoiplineDone('${id}')">VoipLine Done</button>
      </div>
    </div>`;
}

function renderConfirmedCard(sub) {
  const attrs   = getAttrs(sub);
  const prison  = [esc(sub.prison_name), esc(sub.prison_state)].filter(Boolean).join(', ');
  const doneAt  = attrs.voipline_cancelled_at ? fmtDate(attrs.voipline_cancelled_at) : '-';

  return `
    <div class="job-card job-card--active">
      <div class="card-top">
        <div class="card-header-row">
          <div class="card-name">${esc(sub.customer_name || '-')}</div>
          <span class="badge badge--completed">VoipLine done</span>
        </div>
        <div class="card-fields">
          <div class="card-field">
            <span class="field-label">Prison:</span>
            <span class="field-value">${prison || '-'}</span>
          </div>
          <div class="card-field">
            <span class="field-label">DID released:</span>
            <span class="field-value field-value--mono">${formatDID(sub.current_did)}</span>
          </div>
          <div class="card-field">
            <span class="field-label">Cancelled:</span>
            <span class="field-value field-value--muted">${fmtDate(sub.updated_at)}</span>
          </div>
          <div class="card-field">
            <span class="field-label">VoipLine done:</span>
            <span class="field-value field-value--muted">${doneAt}</span>
          </div>
        </div>
      </div>
    </div>`;
}

// ── Confirm VoipLine done ──────────────────────────────────────────────────

window.confirmVoiplineDone = async function(id) {
  const sub = allCancellations.find(s => s.id === id);
  if (!sub) return;
  const btn = document.querySelector(`#cancel-${id} .card-action button`);
  if (btn) { btn.disabled = true; btn.textContent = 'Confirming...'; }

  try {
    await api('confirm_voipline_done', { id });

    // Update local state
    const idx = allCancellations.findIndex(s => s.id === id);
    if (idx >= 0) {
      const existing = getAttrs(allCancellations[idx]);
      allCancellations[idx] = {
        ...allCancellations[idx],
        subscription_attributes: { ...existing, voipline_cancelled: true, voipline_cancelled_at: new Date().toISOString() },
      };
    }

    showSmsToast(
      formatMobile(sub.customer_mobile),
      'Your Prisoncall plan has been cancelled. Your number has been disconnected. Thank you for using Prisoncall. Regards, Prisoncall.'
    );
    showSmsToast(
      'Admin team',
      `Cancellation confirmed. ${sub.customer_name || 'Customer'} DID ${sub.current_did || '-'} released.`
    );

    showToast('Confirmed. Cancellation SMS queued for customer.');
    renderCancellations();
    refreshNavCounts();
  } catch (err) {
    showToast(err.message, 'error');
    if (btn) { btn.disabled = false; btn.textContent = 'VoipLine Done'; }
  }
};

// ── Init ───────────────────────────────────────────────────────────────────

async function init() {
  const session = await initAdminPage();
  if (!session) return;
  await Promise.all([loadCancellations(), refreshNavCounts()]);
}

window.doLogout = function () {
  import('/admin/admin-auth.js').then(m => m.logout());
};

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/admin/sw.js').catch(() => {});
}

init();
</script>

</body>
