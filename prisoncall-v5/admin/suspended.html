  <!-- Main -->

        </button>
        <a href="/admin/settings.html" class="mobile-settings-btn" data-role-min="super_admin" aria-label="Settings">
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" width="18" height="18"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
        </a>

    <div class="admin-content" id="mainContent">

    </div>

  <!-- Bottom tab bar -->
  <nav class="admin-bottom-bar">

        <span>Jobs</span>
        <span class="bar-count" id="bar-jobs-count" style="display:none"></span>

        <span>Suspended</span>

        <span>Cancelled</span>

      <a href="/admin/subscribers.html" class="bottom-bar-item">

<script type="module">
import { initAdminPage, api, fmtDate, formatMobile, showToast, showSmsToast } from '/admin/admin-auth.js';

let allSuspended = [];

// ── Helpers ────────────────────────────────────────────────────────────────

function esc(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function formatDID(did) {
  if (!did) return '-';
  const d = String(did).replace(/\D/g, '');
  if (d.length === 11 && d.startsWith('61')) {
    const local = '0' + d.slice(2);
    return `${local.slice(0,4)} ${local.slice(4,7)} ${local.slice(7)}`;
  }
  return did;
}

function getOverdueBadge(updatedAt) {
  if (!updatedAt) return null;
  const hrs = (Date.now() - new Date(updatedAt).getTime()) / 3600000;
  if (hrs >= 24) return { text: 'URGENT - 24hr overdue', cls: 'overdue-badge--urgent' };
  if (hrs >= 12) return { text: '12hr overdue',          cls: 'overdue-badge--red'    };
  if (hrs >= 4)  return { text: '4hr overdue',           cls: 'overdue-badge--orange' };
  if (hrs >= 2)  return { text: '2hr overdue',           cls: 'overdue-badge--amber'  };
  return null;
}

function smsDayLabel(count) {
  count = parseInt(count) || 0;
  if (count === 0) return 'Awaiting customer payment update';
  return `Day ${count} SMS sent`;
}

function setNavCount(id, n) {
  const el = document.getElementById(id);
  if (!el) return;
  if (n > 0) { el.textContent = n > 99 ? '99+' : n; el.style.display = ''; }
  else el.style.display = 'none';
}

// ── Nav counts ─────────────────────────────────────────────────────────────

async function refreshNavCounts() {
  try {
    const c = await api('get_nav_counts');
    setNavCount('nav-jobs-count',          c.pending_jobs);
    setNavCount('nav-transfers-count',     c.pending_transfers);
    setNavCount('nav-suspended-count',     c.suspended_count);
    setNavCount('nav-cancellations-count', c.pending_cancellations);
    setNavCount('bar-jobs-count',          c.pending_jobs);
    setNavCount('bar-transfers-count',     c.pending_transfers);
    setNavCount('bar-suspended-count',     c.suspended_count);
    setNavCount('bar-cancellations-count', c.pending_cancellations);
  } catch {}
}

// ── Load suspended ─────────────────────────────────────────────────────────

async function loadSuspended() {
  const container = document.getElementById('mainContent');
  container.innerHTML = '<div class="loading-state"><div class="spinner"></div>Loading suspended accounts...</div>';
  try {
    allSuspended = await api('get_suspended');
    renderSuspended();
  } catch (err) {
    container.innerHTML = `<div class="alert alert--error">${esc(err.message)}</div>`;
  }
}

function renderSuspended() {
  const container = document.getElementById('mainContent');

  if (!allSuspended || allSuspended.length === 0) {
    container.innerHTML = `
      <div class="empty-state">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        <h3>No suspended accounts</h3>
        <p>All payments are up to date</p>
      </div>`;
    return;
  }

  container.innerHTML = allSuspended.map(sub => renderSuspendedCard(sub)).join('');
}

function renderSuspendedCard(sub) {
  const id      = sub.id;
  const prison  = [esc(sub.prison_name), esc(sub.prison_state)].filter(Boolean).join(', ');
  const smsDay  = parseInt(sub.sms_day_count) || 0;
  const paused  = smsDay > 0;
  const overdue = !paused ? getOverdueBadge(sub.updated_at) : null;

  return `
    <div class="job-card job-card--suspended" id="suspended-${id}">
      <div class="card-top">
        <div class="card-header-row">
          <div class="card-name">${esc(sub.customer_name || '-')}</div>
          <div class="card-badges">
            <span class="badge badge--suspended">Suspended</span>
            ${overdue ? `<span class="overdue-badge ${overdue.cls}">${overdue.text}</span>` : ''}
          </div>
        </div>
        <div class="card-fields">
          <div class="card-field">
            <span class="field-label">Divert calls to:</span>
            <span class="field-value">${formatMobile(sub.customer_mobile)}</span>
          </div>
          <div class="card-field">
            <span class="field-label">Prison:</span>
            <span class="field-value">${prison || '-'}</span>
          </div>
          <div class="card-field">
            <span class="field-label">Prisoncall No:</span>
            <span class="field-value field-value--mono">${formatDID(sub.current_did)}</span>
          </div>
          ${sub.seal_subscription_id ? `<div class="card-field">
            <span class="field-label">Seal ID:</span>
            <span class="field-value field-value--muted">${esc(sub.seal_subscription_id)}</span>
          </div>` : ''}
          <div class="card-field">
            <span class="field-label">Suspended:</span>
            <span class="field-value field-value--muted">${fmtDate(sub.updated_at)}</span>
          </div>
          <div class="card-field">
            <span class="field-label">SMS status:</span>
            <span class="field-value field-value--muted">${smsDayLabel(sub.sms_day_count)}</span>
          </div>
        </div>
      </div>
      <div class="card-bottom">
        ${!paused
          ? `<button class="btn btn--amber btn--md" onclick="confirmPaused('${id}')">VoipLine Paused</button>`
          : `<button class="btn btn--grey btn--md" disabled>VoipLine Paused</button>`
        }
        <button class="btn btn--green btn--md" onclick="confirmResumed('${id}')">VoipLine Resumed</button>
      </div>
    </div>`;
}

// ── Confirm VoipLine paused ────────────────────────────────────────────────

window.confirmPaused = async function(id) {
  const sub = allSuspended.find(s => s.id === id);
  if (!sub) return;
  const btn = document.querySelector(`#suspended-${id} .btn--amber`);
  if (btn) { btn.disabled = true; btn.textContent = 'Confirming...'; }

  try {
    await api('confirm_voipline_paused', { id });
    const idx = allSuspended.findIndex(s => s.id === id);
    if (idx >= 0) allSuspended[idx] = { ...allSuspended[idx], sms_day_count: 1, last_sms_sent_at: new Date().toISOString() };

    showSmsToast(
      formatMobile(sub.customer_mobile),
      'Your Prisoncall payment failed and your number has been paused. Please update your payment details and reply YES to restore your service. Regards, Prisoncall.'
    );
    showSmsToast(
      'Admin team',
      `VoipLine paused confirmed. ${sub.customer_name || 'Customer'} DID ${sub.current_did || '-'}.`
    );

    showToast('Pause confirmed. Day 1 SMS queued for customer.');
    renderSuspended();
    refreshNavCounts();
  } catch (err) {
    showToast(err.message, 'error');
    if (btn) { btn.disabled = false; btn.textContent = 'VoipLine Paused'; }
  }
};

// ── Confirm VoipLine resumed ───────────────────────────────────────────────

window.confirmResumed = async function(id) {
  const sub = allSuspended.find(s => s.id === id);
  if (!sub) return;
  const btn = document.querySelector(`#suspended-${id} .btn--green`);
  if (btn) { btn.disabled = true; btn.textContent = 'Confirming...'; }

  try {
    await api('confirm_voipline_resumed', { id });

    showSmsToast(
      formatMobile(sub.customer_mobile),
      'Your payment has cleared and your Prisoncall number is active again. Thank you. Regards, Prisoncall.'
    );
    showSmsToast(
      'Admin team',
      `VoipLine resumed confirmed. ${sub.customer_name || 'Customer'} DID ${sub.current_did || '-'}.`
    );

    showToast('Resumed. Service restored SMS queued for customer.');
    allSuspended = allSuspended.filter(s => s.id !== id);
    renderSuspended();
    refreshNavCounts();
  } catch (err) {
    showToast(err.message, 'error');
    if (btn) { btn.disabled = false; btn.textContent = 'VoipLine Resumed'; }
  }
};

// ── Init ───────────────────────────────────────────────────────────────────

async function init() {
  const session = await initAdminPage();
  if (!session) return;
  await Promise.all([loadSuspended(), refreshNavCounts()]);
}

window.doLogout = function () {
  import('/admin/admin-auth.js').then(m => m.logout());
};

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/admin/sw.js').catch(() => {});
}

init();
</script>
