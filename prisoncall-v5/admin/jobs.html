      <a href="/admin/subscribers.html" class="sidebar-nav-item">

        Settings

    <div class="sidebar-footer">

        Sign out

  <!-- Main -->
  <main class="admin-main">
    <header class="admin-topbar">
      <div class="admin-topbar-left">
        <div class="admin-topbar-title">Jobs</div>
      </div>
      <div class="admin-topbar-right">
        <button class="mobile-logout-btn" onclick="doLogout()" aria-label="Sign out">
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/></svg>
        </button>
        <a href="/admin/settings.html" class="mobile-settings-btn" data-role-min="super_admin" aria-label="Settings">
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" width="18" height="18"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
        </a>
      </div>
    </header>

    <div class="admin-content" id="mainContent">
      <div class="loading-state"><div class="spinner"></div>Loading jobs...</div>
    </div>
  </main>

  <!-- Bottom tab bar -->
  <nav class="admin-bottom-bar">
    <div class="bottom-bar-inner">
      <a href="/admin/jobs.html" class="bottom-bar-item active">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
        <span>Jobs</span>
        <span class="bar-count" id="bar-jobs-count" style="display:none"></span>
      </a>
      <a href="/admin/transfers.html" class="bottom-bar-item">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M8 7h12m0 0l-4-4m4 4l-4 4M16 17H4m0 0l4 4m-4-4l4-4"/></svg>
        <span>Transfers</span>
        <span class="bar-count" id="bar-transfers-count" style="display:none"></span>
      </a>
      <a href="/admin/suspended.html" class="bottom-bar-item">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="10" y1="15" x2="10" y2="9"/><line x1="14" y1="15" x2="14" y2="9"/></svg>
        <span>Suspended</span>
        <span class="bar-count" id="bar-suspended-count" style="display:none"></span>
      </a>
      <a href="/admin/cancellations.html" class="bottom-bar-item">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
        <span>Cancelled</span>
        <span class="bar-count" id="bar-cancellations-count" style="display:none"></span>
      </a>
      <a href="/admin/subscribers.html" class="bottom-bar-item">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <span>All</span>
      </a>
    </div>
  </nav>

</div>

<script type="module">
import { initAdminPage, api, fmtDate, formatMobile, showToast, showSmsToast } from '/admin/admin-auth.js';

let allJobs = [];

// ── Helpers ────────────────────────────────────────────────────────────────

function esc(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function formatDID(did) {
  if (!did) return '-';
  const d = String(did).replace(/\D/g, '');
  if (d.length === 11 && d.startsWith('61')) {
    const local = '0' + d.slice(2);
    return `${local.slice(0,4)} ${local.slice(4,7)} ${local.slice(7)}`;
  }
  return did;
}

function getOverdueBadge(createdAt) {
  if (!createdAt) return null;
  const hrs = (Date.now() - new Date(createdAt).getTime()) / 3600000;
  if (hrs >= 24) return { text: 'URGENT - 24hr overdue', cls: 'overdue-badge--urgent' };
  if (hrs >= 12) return { text: '12hr overdue',          cls: 'overdue-badge--red'    };
  if (hrs >= 4)  return { text: '4hr overdue',           cls: 'overdue-badge--orange' };
  if (hrs >= 2)  return { text: '2hr overdue',           cls: 'overdue-badge--amber'  };
  return null;
}

function setNavCount(id, n) {
  const el = document.getElementById(id);
  if (!el) return;
  if (n > 0) { el.textContent = n > 99 ? '99+' : n; el.style.display = ''; }
  else el.style.display = 'none';
}

// ── Nav counts ─────────────────────────────────────────────────────────────

async function refreshNavCounts() {
  try {
    const c = await api('get_nav_counts');
    setNavCount('nav-jobs-count',          c.pending_jobs);
    setNavCount('nav-transfers-count',     c.pending_transfers);
    setNavCount('nav-suspended-count',     c.suspended_count);
    setNavCount('nav-cancellations-count', c.pending_cancellations);
    setNavCount('bar-jobs-count',          c.pending_jobs);
    setNavCount('bar-transfers-count',     c.pending_transfers);
    setNavCount('bar-suspended-count',     c.suspended_count);
    setNavCount('bar-cancellations-count', c.pending_cancellations);
  } catch {}
}

// ── Load jobs ──────────────────────────────────────────────────────────────

async function loadJobs() {
  const container = document.getElementById('mainContent');
  container.innerHTML = '<div class="loading-state"><div class="spinner"></div>Loading jobs...</div>';
  try {
    allJobs = await api('get_jobs');
    renderJobs();
  } catch (err) {
    container.innerHTML = `<div class="alert alert--error">${esc(err.message)}</div>`;
  }
}

function renderJobs() {
  const container = document.getElementById('mainContent');
  const pending = allJobs.filter(s => ['PENDING','ACTIVATING','ACTIVATION_FAILED'].includes(s.status));
  const active  = allJobs.filter(s => s.status === 'ACTIVE');

  let html = '';

  // Pending section
  html += `<div class="section-label"><span class="section-dot section-dot--amber"></span>Needs action (${pending.length})</div>`;
  if (pending.length === 0) {
    html += `<div class="empty-state">
      <svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
      <h3>All clear</h3>
      <p>No pending orders right now</p>
    </div>`;
  } else {
    pending.forEach(sub => { html += renderPendingCard(sub); });
  }

  // Active section
  html += `<div class="section-label"><span class="section-dot section-dot--green"></span>Fulfilled (${active.length})</div>`;
  if (active.length === 0) {
    html += `<p class="text-sm text-muted" style="padding:8px 0">No active subscriptions yet</p>`;
  } else {
    active.forEach(sub => { html += renderActiveCard(sub); });
  }

  container.innerHTML = html;
}

function renderPendingCard(sub) {
  const id      = sub.id;
  const overdue = getOverdueBadge(sub.created_at);
  const prison  = [esc(sub.prison_name), esc(sub.prison_state)].filter(Boolean).join(', ');

  return `
    <div class="job-card job-card--pending" id="job-${id}">
      <div class="card-top">
        <div class="card-header-row">
          <div class="card-name">${esc(sub.customer_name || '-')}</div>
          <div class="card-badges">
            <span class="badge badge--pending">Pending</span>
            ${overdue ? `<span class="overdue-badge ${overdue.cls}">${overdue.text}</span>` : ''}
          </div>
        </div>
        <div class="card-fields">
          <div class="card-field">
            <span class="field-label">Divert calls to:</span>
            <span class="field-value">${formatMobile(sub.customer_mobile)}</span>
          </div>
          <div class="card-field">
            <span class="field-label">Prison:</span>
            <span class="field-value">${prison || '-'}</span>
          </div>
          ${sub.seal_subscription_id ? `<div class="card-field">
            <span class="field-label">Seal ID:</span>
            <span class="field-value field-value--muted">${esc(sub.seal_subscription_id)}</span>
          </div>` : ''}
        </div>
      </div>
      <div class="card-instruction">
        1. Go to VoipLine. Buy a DID for this prison. Set up the user with call diversion to the mobile above.
        2. Enter the DID below and click Fulfil.
      </div>
      <div class="card-action">
        <div class="did-row">
          <input class="form-input form-input--mono" id="did-${id}" placeholder="61XXXXXXXXX" maxlength="11"
            oninput="validateJobDid('${id}')" inputmode="numeric">
          <button class="btn btn--green btn--md" onclick="fulfilJob('${id}')">Fulfil</button>
        </div>
        <div class="form-error" id="did-err-${id}" style="display:none">Must be 11 digits starting with 61</div>
      </div>
    </div>`;
}

function renderActiveCard(sub) {
  const prison = [esc(sub.prison_name), esc(sub.prison_state)].filter(Boolean).join(', ');
  return `
    <div class="job-card job-card--active">
      <div class="card-top">
        <div class="card-header-row">
          <div class="card-name">${esc(sub.customer_name || '-')}</div>
          <span class="badge badge--active">Active</span>
        </div>
        <div class="card-fields">
          <div class="card-field">
            <span class="field-label">Divert calls to:</span>
            <span class="field-value">${formatMobile(sub.customer_mobile)}</span>
          </div>
          <div class="card-field">
            <span class="field-label">Prison:</span>
            <span class="field-value">${prison || '-'}</span>
          </div>
          <div class="card-field">
            <span class="field-label">Prisoncall No:</span>
            <span class="field-value field-value--mono">${formatDID(sub.current_did)}</span>
          </div>
          ${sub.seal_subscription_id ? `<div class="card-field">
            <span class="field-label">Seal ID:</span>
            <span class="field-value field-value--muted">${esc(sub.seal_subscription_id)}</span>
          </div>` : ''}
          <div class="card-field">
            <span class="field-label">Created:</span>
            <span class="field-value field-value--muted">${fmtDate(sub.created_at)}</span>
          </div>
        </div>
      </div>
    </div>`;
}

// ── DID Validation ─────────────────────────────────────────────────────────

window.validateJobDid = function(id) {
  const input = document.getElementById('did-' + id);
  const errEl = document.getElementById('did-err-' + id);
  if (!input || !errEl) return;
  const v = input.value.replace(/\D/g, '');
  errEl.style.display = (!v || (v.length === 11 && v.startsWith('61'))) ? 'none' : '';
};

// ── Fulfil Job ─────────────────────────────────────────────────────────────

window.fulfilJob = async function(id) {
  const input = document.getElementById('did-' + id);
  const errEl = document.getElementById('did-err-' + id);
  if (!input) return;

  const did = input.value.replace(/\D/g, '');
  if (did.length !== 11 || !did.startsWith('61')) {
    if (errEl) errEl.style.display = '';
    return;
  }

  const sub = allJobs.find(s => s.id === id);
  if (!sub) return;

  const btn = input.closest('.card-action').querySelector('button');
  if (btn) { btn.disabled = true; btn.textContent = 'Saving...'; }

  try {
    await api('fulfil_job', { id, current_did: did });

    // Remove from pending, update to ACTIVE
    const idx = allJobs.findIndex(s => s.id === id);
    if (idx >= 0) allJobs[idx] = { ...allJobs[idx], status: 'ACTIVE', current_did: did };

    // SMS stubs
    const formattedDID = formatDID(did);
    const prison       = [sub.prison_name, sub.prison_state].filter(Boolean).join(' ');
    showSmsToast(
      formatMobile(sub.customer_mobile),
      `Your new Prisoncall number is ready. Prison: ${sub.prison_name || '-'}. Prisoncall No: ${formattedDID}. Give this number to your loved one and start receiving calls. Regards, Prisoncall.`
    );
    showSmsToast(
      'Admin team',
      `Order fulfilled. ${sub.customer_name || 'Customer'} DID ${did}. Prison: ${prison}.`
    );

    showToast('Fulfilled. Welcome SMS queued for customer.');
    renderJobs();
    refreshNavCounts();
  } catch (err) {
    showToast(err.message, 'error');
    if (btn) { btn.disabled = false; btn.textContent = 'Fulfil'; }
  }
};

// ── Init ───────────────────────────────────────────────────────────────────

async function init() {
  const session = await initAdminPage();
  if (!session) return;
  await Promise.all([loadJobs(), refreshNavCounts()]);
}

window.doLogout = function () {
  import('/admin/admin-auth.js').then(m => m.logout());
};

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/admin/sw.js').catch(() => {});
}

init();
</script>

</body>
</html>
