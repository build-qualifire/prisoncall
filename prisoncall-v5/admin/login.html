<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Sign In | Prisoncall Admin</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/svg+xml" href="../assets/brand_logos/Prisoncall_Icon_BLACK.svg">
  <link rel="manifest" href="/admin/manifest.json">
  <meta name="theme-color" content="#00D258">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { height: 100%; }
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      background: #F4F5F7;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      -webkit-font-smoothing: antialiased;
    }

    .login-wrap {
      width: 100%;
      max-width: 400px;
    }

    .login-brand {
      text-align: center;
      margin-bottom: 28px;
    }

    .login-logo {
      height: 28px;
      width: auto;
      display: inline-block;
    }

    .login-subtitle {
      font-size: 14px;
      color: #666;
      font-weight: 500;
      margin-top: 8px;
    }

    .login-card {
      background: #fff;
      border: 1px solid #E5E5E5;
      border-radius: 12px;
      padding: 32px;
      box-shadow: 0 2px 16px rgba(0,0,0,0.06);
    }

    .login-title {
      font-size: 20px;
      font-weight: 800;
      color: #101010;
      margin-bottom: 24px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      color: #101010;
      margin-bottom: 6px;
    }

    .form-input {
      width: 100%;
      padding: 11px 14px;
      border: 1.5px solid #E5E5E5;
      border-radius: 8px;
      font-family: inherit;
      font-size: 15px;
      color: #000;
      background: #fff;
      outline: none;
      transition: border-color 150ms ease, box-shadow 150ms ease;
    }

    .form-input:focus {
      border-color: #00D258;
      box-shadow: 0 0 0 3px rgba(0,210,88,0.12);
    }

    .pw-wrap {
      position: relative;
    }

    .pw-toggle {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: #666;
      display: flex;
      align-items: center;
      padding: 4px;
    }

    .pw-toggle svg { width: 18px; height: 18px; }

    .remember-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 20px;
      cursor: pointer;
    }

    .remember-row input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: #00D258;
      cursor: pointer;
    }

    .remember-label {
      font-size: 13px;
      color: #666;
      font-weight: 500;
    }

    .btn-signin {
      width: 100%;
      padding: 14px;
      background: #00D258;
      color: #000;
      font-family: inherit;
      font-size: 15px;
      font-weight: 700;
      border: none;
      border-radius: 80px;
      cursor: pointer;
      transition: opacity 150ms ease, transform 150ms ease;
    }

    .btn-signin:hover { opacity: 0.88; transform: translateY(-1px); }
    .btn-signin:active { transform: translateY(0); }
    .btn-signin:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    .login-error {
      background: #FEF2F2;
      border: 1px solid #fca5a5;
      border-radius: 8px;
      padding: 11px 14px;
      font-size: 13px;
      font-weight: 600;
      color: #991b1b;
      margin-bottom: 16px;
      display: none;
    }

    .login-footer {
      text-align: center;
      margin-top: 20px;
      font-size: 12px;
      color: #aaa;
    }
  </style>
</head>
<body>

<div class="login-wrap">
  <div class="login-brand">
    <img src="/assets/brand_logos/Prisoncall_Black.svg" alt="Prisoncall" class="login-logo">
    <div class="login-subtitle">Admin Portal</div>
  </div>

  <div class="login-card">
    <div class="login-title">Sign in</div>

    <div class="login-error" id="loginError"></div>

    <form id="loginForm" novalidate>
      <div class="form-group">
        <label class="form-label" for="email">Email address</label>
        <input class="form-input" type="email" id="email" name="email"
          placeholder="you@prisoncall.com.au" autocomplete="email" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <div class="pw-wrap">
          <input class="form-input" type="password" id="password" name="password"
            placeholder="Enter your password" autocomplete="current-password" required style="padding-right:44px">
          <button type="button" class="pw-toggle" id="pwToggle" aria-label="Show password">
            <svg id="eyeOpen" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
            <svg id="eyeClosed" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" style="display:none">
              <path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/>
              <line x1="1" y1="1" x2="23" y2="23"/>
            </svg>
          </button>
        </div>
      </div>

      <label class="remember-row">
        <input type="checkbox" id="rememberMe" checked>
        <span class="remember-label">Remember me</span>
      </label>

      <button type="submit" class="btn-signin" id="submitBtn">Sign In</button>
    </form>
  </div>

  <div class="login-footer">Prisoncall Australia - Internal use only</div>
</div>

<script type="module">
  import { login } from '/admin/admin-auth.js';

  const form = document.getElementById('loginForm');
  const emailEl = document.getElementById('email');
  const passwordEl = document.getElementById('password');
  const rememberEl = document.getElementById('rememberMe');
  const submitBtn = document.getElementById('submitBtn');
  const errorEl = document.getElementById('loginError');
  const pwToggle = document.getElementById('pwToggle');
  const eyeOpen = document.getElementById('eyeOpen');
  const eyeClosed = document.getElementById('eyeClosed');

  // Password show/hide
  pwToggle.addEventListener('click', () => {
    const isText = passwordEl.type === 'text';
    passwordEl.type = isText ? 'password' : 'text';
    eyeOpen.style.display = isText ? '' : 'none';
    eyeClosed.style.display = isText ? 'none' : '';
  });

  function showError(msg) {
    errorEl.textContent = msg;
    errorEl.style.display = 'block';
  }

  function hideError() {
    errorEl.style.display = 'none';
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    hideError();

    const email = emailEl.value.trim();
    const password = passwordEl.value;
    const remember = rememberEl.checked;

    if (!email) { showError('Please enter your email address.'); return; }
    if (!password) { showError('Please enter your password.'); return; }

    submitBtn.disabled = true;
    submitBtn.textContent = 'Signing in...';

    try {
      await login(email, password, remember);
      window.location.href = '/admin/dashboard.html';
    } catch (err) {
      showError(err.message || 'Login failed. Please try again.');
      submitBtn.disabled = false;
      submitBtn.textContent = 'Sign In';
    }
  });

  // Register service worker
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/admin/sw.js').catch(() => {});
  }
</script>

</body>
</html>
