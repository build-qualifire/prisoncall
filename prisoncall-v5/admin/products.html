<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Products and Pricing | Prisoncall Admin</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/svg+xml" href="../assets/brand_logos/Prisoncall_Icon_BLACK.svg">
  <link rel="manifest" href="/admin/manifest.json">
  <meta name="theme-color" content="#00D258">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/admin/admin.css">
  <style>
    .product-row {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
      padding: 16px 20px;
      border-bottom: 1px solid var(--color-border);
    }
    @media (min-width: 768px) {
      .product-row {
        grid-template-columns: 180px 110px 140px 160px 160px auto auto;
        align-items: center;
      }
    }
    .product-row:last-child { border-bottom: none; }
    .product-row input.form-input {
      padding: 7px 10px;
      font-size: 13px;
    }
    .product-row .form-input--mono {
      font-family: 'Courier New', monospace;
      font-size: 12px;
    }
  </style>
</head>
<body>

<div class="admin-layout">

  <!-- Sidebar -->
  <aside class="admin-sidebar">
    <div class="sidebar-brand">
      <img src="/assets/brand_logos/Prisoncall_White.svg" alt="Prisoncall" class="sidebar-logo">
    </div>
    <nav class="sidebar-nav">
      <a href="/admin/dashboard.html" class="sidebar-nav-item">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
        Dashboard
      </a>
      <a href="/admin/orders.html" class="sidebar-nav-item">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
        Orders
      </a>
      <a href="/admin/customers.html" class="sidebar-nav-item">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/></svg>
        Customers
      </a>
      <a href="/admin/products.html" class="sidebar-nav-item active">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/></svg>
        Products
      </a>
      <a href="/admin/settings.html" class="sidebar-nav-item" data-role-min="super_admin">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
        Settings
      </a>
    </nav>
    <div class="sidebar-footer">
      <div class="sidebar-user-email" data-user-email></div>
      <button class="btn-logout" onclick="doLogout()">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/></svg>
        Sign out
      </button>
    </div>
  </aside>

  <!-- Main -->
  <main class="admin-main">
    <header class="admin-topbar">
      <div class="admin-topbar-title">Products and Pricing</div>
    </header>

    <div class="admin-content">

      <div id="productsContent">
        <div class="loading-state">
          <div class="spinner"></div>
          Loading products...
        </div>
      </div>

    </div>
  </main>

  <!-- Bottom tab bar (not shown for super_admin-only pages) -->

</div>

<script type="module">
  import {
    initAdminPage, api, logout, fmtCurrency, showToast
  } from '/admin/admin-auth.js';

  let allProducts = [];

  async function init() {
    // Redirect non-super_admin
    const session = await initAdminPage('super_admin');
    if (!session) return;

    loadProducts();
  }

  async function loadProducts() {
    const container = document.getElementById('productsContent');
    container.innerHTML = '<div class="loading-state"><div class="spinner"></div>Loading products...</div>';

    try {
      allProducts = await api('getProducts');

      if (!allProducts || allProducts.length === 0) {
        container.innerHTML = `<div class="empty-state">
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/></svg>
          <h3>No products found</h3>
          <p>Products will appear here once added to the database.</p>
        </div>`;
        return;
      }

      // Separate plans and add-ons
      // Plans: fortnightly, monthly, half-yearly (never weekly)
      const planIntervals = ['fortnightly', 'monthly', 'half-yearly', 'half_yearly', 'biannual', '6-monthly'];
      const addonNames = ['Transfer Guarantee', 'Renewal Guarantee', 'Transfer + Renewal Combo', 'Cancellation Guarantee', 'Lifetime Protection', '48hr Cancellation', 'Combo'];

      const plans = allProducts.filter(p => {
        const interval = (p.plan_interval || '').toLowerCase();
        return planIntervals.includes(interval) || !isAddon(p.product_name);
      });

      const addons = allProducts.filter(p => isAddon(p.product_name));

      container.innerHTML = `
        <div class="card mb-16">
          <div class="product-section-title">Plans (Fortnightly, Monthly, Half-Yearly)</div>
          <div id="plansSection">${renderProductRows(plans)}</div>
        </div>

        <div class="card">
          <div class="product-section-title">Add-ons</div>
          <div id="addonsSection">${renderProductRows(addons)}</div>
        </div>`;

    } catch (err) {
      container.innerHTML = `<div class="alert alert--error" style="margin:0">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" width="18" height="18"><circle cx="12" cy="12" r="10"/></svg>
        ${err.message}
      </div>`;
    }
  }

  function isAddon(name) {
    if (!name) return false;
    const n = name.toLowerCase();
    return n.includes('guarantee') || n.includes('combo') || n.includes('lifetime') || n.includes('protection') || n.includes('addon');
  }

  function renderProductRows(products) {
    if (!products || products.length === 0) {
      return '<div style="padding:20px;text-align:center;font-size:14px;color:var(--color-muted)">No items</div>';
    }

    return products.map(p => `
      <div class="product-row" data-product-id="${p.id}">
        <div>
          <div class="product-name">${p.product_name || '-'}</div>
          <div class="product-interval">${cap(p.plan_interval || '')}</div>
        </div>
        <div>
          <label style="font-size:11px;font-weight:700;color:var(--color-muted);text-transform:uppercase;letter-spacing:.04em;display:block;margin-bottom:4px">Price (AUD)</label>
          <input class="form-input" type="number" step="0.01" min="0"
            data-field="plan_price" value="${p.plan_price || ''}" placeholder="0.00">
        </div>
        <div>
          <label style="font-size:11px;font-weight:700;color:var(--color-muted);text-transform:uppercase;letter-spacing:.04em;display:block;margin-bottom:4px">Shopify Variant ID</label>
          <input class="form-input form-input--mono" type="text"
            data-field="shopify_variant_id" value="${p.shopify_variant_id || ''}" placeholder="variant_id">
        </div>
        <div>
          <label style="font-size:11px;font-weight:700;color:var(--color-muted);text-transform:uppercase;letter-spacing:.04em;display:block;margin-bottom:4px">Appstle Selling Plan ID</label>
          <input class="form-input form-input--mono" type="text"
            data-field="appstle_selling_plan_id" value="${p.appstle_selling_plan_id || ''}" placeholder="selling_plan_id">
        </div>
        <div style="display:flex;align-items:center;gap:8px;padding-top:2px">
          <label style="font-size:11px;font-weight:700;color:var(--color-muted);text-transform:uppercase;letter-spacing:.04em;display:block;margin-bottom:4px">Active</label>
          <label class="toggle-wrap">
            <div class="toggle">
              <input type="checkbox" data-field="active" ${p.active ? 'checked' : ''}>
              <span class="toggle-slider"></span>
            </div>
          </label>
        </div>
        <div>
          <button class="btn btn--green btn--sm" onclick="saveProduct('${p.id}', this)">Save</button>
        </div>
      </div>`).join('');
  }

  function cap(s) {
    if (!s) return '';
    return s.charAt(0).toUpperCase() + s.slice(1).replace('_', '-');
  }

  window.saveProduct = async function (productId, btn) {
    const row = btn.closest('.product-row');
    const fields = {};

    row.querySelectorAll('[data-field]').forEach(el => {
      const field = el.dataset.field;
      if (el.type === 'checkbox') {
        fields[field] = el.checked;
      } else if (el.type === 'number') {
        fields[field] = parseFloat(el.value) || 0;
      } else {
        fields[field] = el.value.trim();
      }
    });

    btn.disabled = true;
    btn.textContent = 'Saving...';

    try {
      await api('updateProduct', { id: productId, fields });
      showToast('Product saved.');
    } catch (err) {
      showToast(err.message, 'error');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Save';
    }
  };

  window.doLogout = function () {
    import('/admin/admin-auth.js').then(m => m.logout());
  };

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/admin/sw.js').catch(() => {});
  }

  init();
</script>

</body>
</html>
