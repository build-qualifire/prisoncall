<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/svg+xml" href="../assets/brand_logos/Prisoncall_Icon_BLACK.svg">
  <link rel="manifest" href="/admin/manifest.json">
  <meta name="theme-color" content="#00D258">
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link rel="stylesheet" href="/admin/admin.css">
</head>
<body>

<div class="admin-layout">

  <!-- Sidebar -->

      <img src="/assets/brand_logos/Prisoncall_White.svg" alt="Prisoncall" class="sidebar-logo">
    </div>
    <nav class="sidebar-nav">

        Jobs
        <span class="nav-count" id="nav-jobs-count" style="display:none"></span>
      </a>
      <a href="/admin/transfers.html" class="sidebar-nav-item">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M8 7h12m0 0l-4-4m4 4l-4 4M16 17H4m0 0l4 4m-4-4l4-4"/></svg>
        Transfers
        <span class="nav-count" id="nav-transfers-count" style="display:none"></span>
      </a>
      <a href="/admin/suspended.html" class="sidebar-nav-item">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="10" y1="15" x2="10" y2="9"/><line x1="14" y1="15" x2="14" y2="9"/></svg>
        Suspended
        <span class="nav-count" id="nav-suspended-count" style="display:none"></span>
      </a>
      <a href="/admin/cancellations.html" class="sidebar-nav-item">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
        Cancellations
        <span class="nav-count" id="nav-cancellations-count" style="display:none"></span>
      </a>
      <a href="/admin/subscribers.html" class="sidebar-nav-item active">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        Subscribers
      </a>
      <a href="/admin/settings.html" class="sidebar-nav-item" data-role-min="super_admin">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
        Settings
      </a>
    </nav>
    <div class="sidebar-footer">
      <div class="sidebar-user-email" data-user-email></div>
      <button class="btn-logout" onclick="doLogout()">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/></svg>
        Sign out
      </button>
    </div>
  </aside>

  <!-- Main -->
  <main class="admin-main">
    <header class="admin-topbar">
      <div class="admin-topbar-left">
        <div class="admin-topbar-title">Subscribers</div>
        <span class="badge badge--grey" id="subCount" style="display:none"></span>
      </div>
      <div class="admin-topbar-right">
        <button class="btn btn--outline btn--sm export-btn" onclick="exportCSV()" style="display:none" id="exportBtn">
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" width="14" height="14"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
          Export CSV
        </button>
        <button class="mobile-logout-btn" onclick="doLogout()" aria-label="Sign out">
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/></svg>
        </button>
        <a href="/admin/settings.html" class="mobile-settings-btn" data-role-min="super_admin" aria-label="Settings">
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" width="18" height="18"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
        </a>
      </div>
    </header>

    <div class="admin-content">

      <!-- Search + filter bar -->
      <div class="admin-search-bar">
        <div class="search-wrap">
          <svg class="search-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
          <input class="form-input search-input" type="text" id="searchInput"
            placeholder="Search by name, mobile, DID or prison..." autocomplete="off">
        </div>
        <div class="filter-tabs" id="filterTabs">
          <button class="filter-tab active" data-status="">All</button>
          <button class="filter-tab" data-status="ACTIVE">Active</button>
          <button class="filter-tab" data-status="PENDING">Pending</button>
          <button class="filter-tab" data-status="SUSPENDED">Suspended</button>
          <button class="filter-tab" data-status="CANCELLED">Cancelled</button>
        </div>
      </div>

      <!-- Table (desktop) -->
      <div class="sub-table-wrap sub-content-offset" id="tableWrap">
        <table class="sub-table">
          <thead>
            <tr>
              <th>Customer</th>
              <th>Mobile</th>
              <th>Prisoncall No</th>
              <th>Prison</th>
              <th>Plan</th>
              <th>Price</th>
              <th>Add-ons</th>
              <th>Status</th>
              <th>Seal ID</th>
              <th>Next billing</th>
              <th>Created</th>
            </tr>
          </thead>
          <tbody id="tableBody">
            <tr><td colspan="11"><div class="loading-state"><div class="spinner"></div>Loading...</div></td></tr>
          </tbody>
        </table>
      </div>

      <!-- Cards (mobile) -->
      <div class="sub-card-list sub-content-offset" id="cardList">
        <div class="loading-state"><div class="spinner"></div>Loading subscribers...</div>
      </div>

    </div>
  </main>

  <!-- Bottom tab bar -->
  <nav class="admin-bottom-bar">
    <div class="bottom-bar-inner">
      <a href="/admin/jobs.html" class="bottom-bar-item">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
        <span>Jobs</span>
        <span class="bar-count" id="bar-jobs-count" style="display:none"></span>
      </a>
      <a href="/admin/transfers.html" class="bottom-bar-item">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M8 7h12m0 0l-4-4m4 4l-4 4M16 17H4m0 0l4 4m-4-4l4-4"/></svg>
        <span>Transfers</span>
        <span class="bar-count" id="bar-transfers-count" style="display:none"></span>
      </a>
      <a href="/admin/suspended.html" class="bottom-bar-item">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="10" y1="15" x2="10" y2="9"/><line x1="14" y1="15" x2="14" y2="9"/></svg>
        <span>Suspended</span>
        <span class="bar-count" id="bar-suspended-count" style="display:none"></span>
      </a>
      <a href="/admin/cancellations.html" class="bottom-bar-item">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
        <span>Cancelled</span>
        <span class="bar-count" id="bar-cancellations-count" style="display:none"></span>
      </a>
      <a href="/admin/subscribers.html" class="bottom-bar-item active">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <span>All</span>
      </a>
    </div>
  </nav>

</div>

<script type="module">
import { initAdminPage, api, fmtDate, formatMobile, showToast } from '/admin/admin-auth.js';

let allSubs = [];
let filterStatus = '';
let searchTerm   = '';
let searchTimeout;

// ── Helpers ────────────────────────────────────────────────────────────────

function esc(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function formatDID(did) {
  if (!did) return '-';
  const d = String(did).replace(/\D/g, '');
  if (d.length === 11 && d.startsWith('61')) {
    const local = '0' + d.slice(2);
    return `${local.slice(0,4)} ${local.slice(4,7)} ${local.slice(7)}`;
  }
  return did;
}

function capPlan(interval) {
  if (!interval) return '-';
  const map = { fortnightly: 'Fortnightly', monthly: 'Monthly', half_yearly: 'Half-Yearly', halfyearly: 'Half-Yearly', 'half-yearly': 'Half-Yearly' };
  return map[interval.toLowerCase()] || interval;
}

function statusBadge(status) {
  const map = {
    PENDING:   'badge--pending',  ACTIVE:    'badge--active',
    SUSPENDED: 'badge--suspended', CANCELLED: 'badge--cancelled',
    ACTIVATING:'badge--purple',   ACTIVATION_FAILED:'badge--red',
  };
  const labels = {
    PENDING:'Pending', ACTIVE:'Active', SUSPENDED:'Suspended', CANCELLED:'Cancelled',
    ACTIVATING:'Activating', ACTIVATION_FAILED:'Failed',
  };
  return `<span class="badge ${map[status] || 'badge--grey'}">${labels[status] || status || '-'}</span>`;
}

function addonBadges(sub) {
  const parts = [];
  if (sub.addon_transfer_guarantee)     parts.push('TG');
  if (sub.addon_renewal_guarantee)      parts.push('RG');
  if (sub.addon_combo)                  parts.push('Combo');
  if (sub.addon_cancellation_guarantee) parts.push('CG');
  if (sub.addon_lifetime_protection)    parts.push('LP');
  return parts.length ? parts.map(p => `<span class="badge badge--addon">${p}</span>`).join(' ') : '-';
}

function setNavCount(id, n) {
  const el = document.getElementById(id);
  if (!el) return;
  if (n > 0) { el.textContent = n > 99 ? '99+' : n; el.style.display = ''; }
  else el.style.display = 'none';
}

// ── Nav counts ─────────────────────────────────────────────────────────────

async function refreshNavCounts() {
  try {
    const c = await api('get_nav_counts');
    setNavCount('nav-jobs-count',          c.pending_jobs);
    setNavCount('nav-transfers-count',     c.pending_transfers);
    setNavCount('nav-suspended-count',     c.suspended_count);
    setNavCount('nav-cancellations-count', c.pending_cancellations);
    setNavCount('bar-jobs-count',          c.pending_jobs);
    setNavCount('bar-transfers-count',     c.pending_transfers);
    setNavCount('bar-suspended-count',     c.suspended_count);
    setNavCount('bar-cancellations-count', c.pending_cancellations);
  } catch {}
}

// ── Load ───────────────────────────────────────────────────────────────────

async function loadSubs() {
  const tableBody = document.getElementById('tableBody');
  const cardList  = document.getElementById('cardList');
  const loadHtml  = '<tr><td colspan="11"><div class="loading-state"><div class="spinner"></div>Loading...</div></td></tr>';
  tableBody.innerHTML = loadHtml;
  cardList.innerHTML  = '<div class="loading-state"><div class="spinner"></div>Loading subscribers...</div>';

  try {
    const params = {};
    if (filterStatus) params.status = filterStatus;
    if (searchTerm)   params.search = searchTerm;
    allSubs = await api('get_all_subscribers', params);

    const countEl  = document.getElementById('subCount');
    const exportBtn = document.getElementById('exportBtn');
    if (allSubs && allSubs.length > 0) {
      countEl.textContent  = allSubs.length;
      countEl.style.display  = '';
      exportBtn.style.display = '';
    } else {
      countEl.style.display  = 'none';
      exportBtn.style.display = 'none';
    }

    renderTable();
    renderCards();
  } catch (err) {
    tableBody.innerHTML = `<tr><td colspan="11"><div class="alert alert--error">${esc(err.message)}</div></td></tr>`;
    cardList.innerHTML  = `<div class="alert alert--error">${esc(err.message)}</div>`;
  }
}

// ── Render desktop table ───────────────────────────────────────────────────

function renderTable() {
  const tableBody = document.getElementById('tableBody');
  if (!allSubs || allSubs.length === 0) {
    tableBody.innerHTML = `<tr><td colspan="11"><div class="empty-state">
      <svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      <h3>No subscribers found</h3>
      <p>Try adjusting your search or filter</p>
    </div></td></tr>`;
    return;
  }

  tableBody.innerHTML = allSubs.map(s => `
    <tr>
      <td style="font-weight:700">${esc(s.customer_name || '-')}</td>
      <td>${esc(formatMobile(s.customer_mobile))}</td>
      <td style="font-family:monospace;font-size:12px">${esc(formatDID(s.current_did))}</td>
      <td>${esc([s.prison_name, s.prison_state].filter(Boolean).join(', ') || '-')}</td>
      <td>${capPlan(s.plan_interval)}</td>
      <td>${s.plan_price ? '$' + parseFloat(s.plan_price).toFixed(2) : '-'}</td>
      <td>${addonBadges(s)}</td>
      <td>${statusBadge(s.status)}</td>
      <td style="color:var(--color-muted)">${esc(s.seal_subscription_id || '-')}</td>
      <td style="color:var(--color-muted)">${fmtDate(s.next_billing_date)}</td>
      <td style="color:var(--color-muted)">${fmtDate(s.created_at)}</td>
    </tr>`).join('');
}

// ── Render mobile cards ────────────────────────────────────────────────────

function renderCards() {
  const cardList = document.getElementById('cardList');
  if (!allSubs || allSubs.length === 0) {
    cardList.innerHTML = `<div class="empty-state">
      <svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      <h3>No subscribers found</h3>
      <p>Try adjusting your search or filter</p>
    </div>`;
    return;
  }

  cardList.innerHTML = allSubs.map(s => {
    const prison = [s.prison_name, s.prison_state].filter(Boolean).join(', ');
    return `
      <div class="sub-card">
        <div class="sub-card-name">${esc(s.customer_name || '-')} ${statusBadge(s.status)}</div>
        <div class="sub-card-row"><span class="sub-card-label">Mobile:</span><span class="sub-card-val">${esc(formatMobile(s.customer_mobile))}</span></div>
        <div class="sub-card-row"><span class="sub-card-label">Prisoncall No:</span><span class="sub-card-val" style="font-family:monospace">${formatDID(s.current_did)}</span></div>
        <div class="sub-card-row"><span class="sub-card-label">Prison:</span><span class="sub-card-val">${esc(prison || '-')}</span></div>
        <div class="sub-card-row"><span class="sub-card-label">Plan:</span><span class="sub-card-val">${capPlan(s.plan_interval)}${s.plan_price ? ' - $' + parseFloat(s.plan_price).toFixed(2) : ''}</span></div>
        ${s.seal_subscription_id ? `<div class="sub-card-row"><span class="sub-card-label">Seal ID:</span><span class="sub-card-val" style="color:var(--color-muted)">${esc(s.seal_subscription_id)}</span></div>` : ''}
        <div class="sub-card-row"><span class="sub-card-label">Created:</span><span class="sub-card-val" style="color:var(--color-muted)">${fmtDate(s.created_at)}</span></div>
      </div>`;
  }).join('');
}

// ── Export CSV ─────────────────────────────────────────────────────────────

window.exportCSV = function() {
  if (!allSubs || allSubs.length === 0) return;
  const cols = [
    'customer_name', 'customer_mobile', 'current_did', 'prison_name', 'prison_state',
    'plan_interval', 'plan_price', 'status', 'seal_subscription_id',
    'next_billing_date', 'created_at',
  ];
  const header = cols.join(',');
  const rows   = allSubs.map(s =>
    cols.map(c => `"${String(s[c] || '').replace(/"/g, '""')}"`).join(',')
  );
  const csv  = [header, ...rows].join('\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href     = url;
  a.download = `prisoncall-subscribers-${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  URL.revokeObjectURL(url);
};

// ── Filters + search ───────────────────────────────────────────────────────

document.getElementById('filterTabs').addEventListener('click', e => {
  const btn = e.target.closest('.filter-tab');
  if (!btn) return;
  document.querySelectorAll('.filter-tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  filterStatus = btn.dataset.status;
  loadSubs();
});

document.getElementById('searchInput').addEventListener('input', e => {
  clearTimeout(searchTimeout);
  searchTerm   = e.target.value.trim();
  searchTimeout = setTimeout(loadSubs, 350);
});

// ── Init ───────────────────────────────────────────────────────────────────

async function init() {
  const session = await initAdminPage();
  if (!session) return;
  await Promise.all([loadSubs(), refreshNavCounts()]);
}

window.doLogout = function () {
  import('/admin/admin-auth.js').then(m => m.logout());
};

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/admin/sw.js').catch(() => {});
}

init();
</script>

</body>
</html>
